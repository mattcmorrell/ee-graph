.execution-step { display: flex; gap: 10px; font-size: 15px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.5; }
.execution-step-num { width: 20px; height: 20px; background: rgba(179,136,255,0.2); color: var(--agent-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }

/* COMPLIANCE */
.compliance-score { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding: 20px 24px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); flex-wrap: wrap; }
.compliance-score-circle { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; flex-shrink: 0; }
.compliance-score-info { flex: 1; }
.compliance-score-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.compliance-score-subtitle { font-size: 15px; color: var(--text-secondary); }
.compliance-score-breakdown { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
.compliance-score-item { font-size: 13px; color: var(--text-muted); }
.compliance-score-item strong { color: var(--text-primary); }
.timeline-visual { position: relative; margin-bottom: 28px; padding: 20px 0; overflow-x: auto; }
.timeline-axis { display: flex; align-items: center; height: 50px; position: relative; min-width: 700px; padding: 0 40px; }
.timeline-line { position: absolute; top: 50%; left: 40px; right: 40px; height: 2px; background: var(--border-medium); transform: translateY(-50%); }
.timeline-marker { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--bg-primary); z-index: 2; cursor: pointer; transition: transform 0.2s; }
.timeline-marker:hover { transform: translate(-50%, -50%) scale(1.3); }
.timeline-marker.red { background: var(--accent-red); }
.timeline-marker.yellow { background: var(--accent-yellow); }
.timeline-marker.green { background: var(--accent-green); }
.timeline-marker.gray { background: var(--text-muted); }
.timeline-marker-label { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.compliance-cards { display: flex; flex-direction: column; gap: 12px; }
.compliance-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: start; }
.compliance-card-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; }
.compliance-card-dot.red { background: var(--accent-red); }
.compliance-card-dot.yellow { background: var(--accent-yellow); }
.compliance-card-dot.green { background: var(--accent-green); }
.compliance-card-dot.gray { background: var(--text-muted); }
.compliance-card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.compliance-card-when { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.compliance-card-desc { font-size: 15px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 6px; }
.compliance-card-desc .done-text { color: var(--accent-green); font-weight: 500; }
.compliance-card-desc .pending-text { color: var(--accent-yellow); font-weight: 500; }
.compliance-card-legal { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.compliance-card-meta { text-align: right; }
.compliance-card-countdown { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
.compliance-card-countdown.red { background: var(--accent-red-dim); color: var(--accent-red); }
.compliance-card-countdown.yellow { background: var(--accent-yellow-dim); color: var(--accent-yellow); }
.compliance-card-countdown.green { background: var(--accent-green-dim); color: var(--accent-green); }
.compliance-card-countdown.gray { background: var(--bg-tertiary); color: var(--text-muted); }
.compliance-card-owner { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* LOADING */
.loading-container { display: flex; align-items: center; justify-content: center; min-height: 400px; flex-direction: column; gap: 16px; }
.loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border-medium); border-top-color: var(--agent-accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 15px; color: var(--text-muted); }

/* ANIMATIONS */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: fadeInUp 0.3s ease both; }
.approve-check { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-green); font-weight: 600; font-size: 15px; }
@keyframes checkPop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
.check-icon { animation: checkPop 0.3s ease both; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .top-bar { padding: 12px 16px 0; }
  .main-content { padding: 16px; }
  .header-row { gap: 10px; }
  .version-switcher { margin-left: 0; }
  .person-picker { margin-left: 0; width: 100%; }
  .person-picker select { flex: 1; }
  .impact-sections { grid-template-columns: 1fr; }
  .scenario-comparison { grid-template-columns: 1fr; }
  .person-card { flex-direction: column; text-align: center; }
  .person-stats { justify-content: center; }
  .scenario-reasoning, .scenario-comparison, .scenario-metrics, .scenario-risk, .scenario-risk-text { padding-left: 0; }
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <div class="header-row">
      <div class="brand">
        <div class="brand-icon">G</div>
        <div class="brand-text"><span>Departure</span> Cascade</div>
      </div>
      <div class="version-switcher">
        <a href="departure-cascade.html">v1</a>
        <span class="sep">|</span>
        <a href="departure-cascade-v2.html">v2</a>
        <span class="sep">|</span>
        <a href="departure-cascade-v3.html">v3</a>
        <span class="sep">|</span>
        <span class="active-version">v4</span>
      </div>
      <div class="person-picker">
        <label>Departing</label>
        <select id="personSelect"></select>
      </div>
    </div>
    <div class="tab-nav" id="tabNav">
      <button class="tab-btn active" data-tab="story">Impact Story</button>
      <button class="tab-btn" data-tab="offboarding">Offboarding <span class="tab-badge" id="offboardingBadge">0</span></button>
      <button class="tab-btn" data-tab="restructuring">Restructuring</button>
      <button class="tab-btn" data-tab="compliance">Compliance</button>
    </div>
  </div>
</div>

<div class="main-content">
  <div id="loadingState" class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">Analyzing organizational connections...</div>
  </div>
  <div class="tab-panel active" id="tab-story"></div>
  <div class="tab-panel" id="tab-offboarding"></div>
  <div class="tab-panel" id="tab-restructuring"></div>
  <div class="tab-panel" id="tab-compliance"></div>
</div>

<script>
/* ============================================================
   DATA LOADING & GRAPH HELPERS
   ============================================================ */
let NODES = {};
let EDGES = [];
let ALL_NODES = [];

async function loadData() {
  const [nodesRes, edgesRes] = await Promise.all([
    fetch('../data/nodes.json'),
    fetch('../data/edges.json')
  ]);
  const nodesData = await nodesRes.json();
  const edgesData = await edgesRes.json();
  ALL_NODES = nodesData.nodes;
  EDGES = edgesData.edges;
  ALL_NODES.forEach(n => NODES[n.id] = n);
}

function getNode(id) { return NODES[id] || null; }
function prop(id, key) {
  const n = getNode(id);
  return n ? (n.properties || {})[key] : null;
}
function edgesFrom(nodeId, type) {
  return EDGES.filter(e => e.source === nodeId && (!type || e.type === type));
}
function edgesTo(nodeId, type) {
  return EDGES.filter(e => e.target === nodeId && (!type || e.type === type));
}
function getDirectReports(personId) {
  return edgesTo(personId, 'reports_to').map(e => e.source);
}
function getManager(personId) {
  const e = edgesFrom(personId, 'reports_to')[0];
  return e ? e.target : null;
}
function getDependents(personId) {
  return edgesFrom(personId, 'has_dependent').map(e => e.target);
}
function getBenefits(personId) {
  return edgesFrom(personId, 'has_benefits').map(e => ({ id: e.target, meta: e.metadata || {} }));
}
function getComp(personId) {
  return edgesFrom(personId, 'has_comp').map(e => e.target);
}
function getProjects(personId) {
  return edgesFrom(personId, 'works_on').map(e => ({ id: e.target, meta: e.metadata || {} }));
}
function getTeams(personId) {
  return edgesFrom(personId, 'member_of').filter(e => {
    const n = getNode(e.target);
    return n && n.type === 'team';
  }).map(e => ({ id: e.target, meta: e.metadata || {} }));
}
function getJurisdictions(personId) {
  return edgesFrom(personId, 'subject_to').map(e => e.target);
}
function getCandidatesForPosition(posId) {
  return EDGES.filter(e => e.type === 'candidate_for' && e.target === posId).map(e => ({
    id: e.source, meta: e.metadata || {}
  }));
}
function getPosition(personId) {
  const e = edgesFrom(personId, 'holds_position')[0];
  return e ? e.target : null;
}
function getDependentBenefits(depId) {
  return edgesFrom(depId, 'dependent_covered_by').map(e => e.target);
}
function getMentees(personId) {
  return edgesFrom(personId, 'mentors').map(e => e.target);
}
function getEquipment(personId) {
  return edgesFrom(personId, 'assigned_equipment').map(e => e.target);
}
function getEquityComp(personId) {
  return getComp(personId).map(id => getNode(id)).filter(n => n && (n.properties || {}).type === 'equity')[0];
}
function getSalaryComp(personId) {
  return getComp(personId).map(id => getNode(id)).filter(n => n && (n.properties || {}).type === 'salary')[0];
}
function tenureYears(startDate) {
  const start = new Date(startDate);
  const now = new Date('2026-02-06');
  return ((now - start) / (365.25 * 24 * 60 * 60 * 1000)).toFixed(1);
}
function formatMoney(n) {
  return '$' + Number(n).toLocaleString();
}
function totalActivePeople() {
  return ALL_NODES.filter(n => n.type === 'person' && (n.properties || {}).status === 'active').length;
}

/* ============================================================
   PERSON PICKER
   ============================================================ */
function populatePersonPicker() {
  const sel = document.getElementById('personSelect');
  const people = ALL_NODES.filter(n => n.type === 'person' && (n.properties || {}).status === 'active')
    .sort((a,b) => (a.properties.name || '').localeCompare(b.properties.name || ''));
  people.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.properties.name + ' - ' + p.properties.role;
    if (p.id === 'person-008') opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => buildAllTabs(sel.value));
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const btn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  if (btn) btn.classList.add('active');
  const panel = document.getElementById('tab-' + tabName);
  if (panel) panel.classList.add('active');
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    switchTab(btn.dataset.tab);
  });
});

/* ============================================================
   BUILD ALL TABS
   ============================================================ */
function buildAllTabs(personId) {
  const person = getNode(personId);
  if (!person) return;
  const p = person.properties;
  const reports = getDirectReports(personId);
  const managerId = getManager(personId);
  const manager = getNode(managerId);
  const managerName = manager ? manager.properties.name : 'Unknown';
  const dependents = getDependents(personId);
  const benefits = getBenefits(personId);
  const projects = getProjects(personId);
  const teams = getTeams(personId);
  const jurisdictions = getJurisdictions(personId);
  const positionId = getPosition(personId);
  const position = getNode(positionId);
  const equity = getEquityComp(personId);
  const salary = getSalaryComp(personId);
  const mentees = getMentees(personId);
  const total = totalActivePeople();
  const equipment = getEquipment(personId);

  const depBenefitsList = [];
  dependents.forEach(dId => {
    const dep = getNode(dId);
    const depBens = getDependentBenefits(dId);
    depBenefitsList.push({ dep, benefits: depBens.map(b => getNode(b)).filter(Boolean) });
  });

  const candidates = positionId ? getCandidatesForPosition(positionId) : [];
  const candidateNodes = candidates.map(c => ({ node: getNode(c.id), meta: c.meta })).filter(c => c.node);
  const offerCandidates = candidateNodes.filter(c => (c.meta.stage === 'offer' || (c.node.properties || {}).status === 'offer'));
  const interviewCandidates = candidateNodes.filter(c => c.meta.stage === 'interviewing' || (c.node.properties || {}).status === 'interviewing');

  const salaryAmt = salary ? salary.properties.amount : 0;
  const equityAmt = equity ? equity.properties.amount : 0;
  const totalComp = salaryAmt + equityAmt;
  const unvestedShares = equity ? (equity.properties.totalShares || 0) - (equity.properties.vestedShares || 0) : 0;
  const unvestedValue = equity ? Math.round((equityAmt / (equity.properties.totalShares || 1)) * unvestedShares) : 0;
  const tenure = tenureYears(p.startDate);
  const pctHeadcount = total > 0 ? ((reports.length / total) * 100).toFixed(1) : '?';

  const hasCobra = depBenefitsList.some(d => d.benefits.some(b => b.properties.type === 'medical'));
  const depNames = depBenefitsList.map(d => d.dep ? d.dep.properties.name : 'Unknown');
  const medicalBenefits = depBenefitsList.flatMap(d => d.benefits.filter(b => b.properties.type === 'medical'));
  const medicalPlan = medicalBenefits.length > 0 ? medicalBenefits[0] : null;

  const jurisdictionNames = jurisdictions.map(j => { const n = getNode(j); return n ? n.properties.name : ''; }).filter(Boolean);
  const hasTexas = jurisdictionNames.includes('Texas');

  const ctx = {
    personId, p, reports, managerId, manager, managerName, dependents, depBenefitsList,
    benefits, projects, teams, jurisdictions, jurisdictionNames, hasTexas,
    positionId, position, equity, salary, mentees, total, equipment,
    candidateNodes, offerCandidates, interviewCandidates,
    salaryAmt, equityAmt, totalComp, unvestedShares, unvestedValue,
    tenure, pctHeadcount, hasCobra, depNames, medicalPlan
  };

  // Count actions for badge
  const actionCount = 3 + dependents.length + benefits.length + projects.length + teams.length;
  const clampedActions = Math.min(actionCount, 18);
  document.getElementById('offboardingBadge').textContent = clampedActions;
  ctx.actionCount = clampedActions;

  buildStoryTab(ctx);
  buildOffboardingTab(ctx);
  buildRestructuringTab(ctx);
  buildComplianceTab(ctx);
}

/* ============================================================
   TAB 1: IMPACT STORY (LEAD TAB)
   ============================================================ */
function buildStoryTab(ctx) {
  const { personId, p, reports, managerName, managerId, dependents, depBenefitsList, benefits,
    projects, teams, candidateNodes, offerCandidates, equity, salary,
    salaryAmt, equityAmt, totalComp, unvestedShares, unvestedValue,
    tenure, pctHeadcount, hasCobra, depNames, medicalPlan, total, actionCount,
    position, jurisdictionNames } = ctx;

  const el = document.getElementById('tab-story');

  const ic3Reports = reports.filter(r => prop(r, 'level') === 'IC-3');

  // Build report snippet
  const reportSnippet = reports.slice(0, 4).map(r => {
    const name = prop(r, 'name') || 'Unknown';
    const role = prop(r, 'role') || '';
    return '<div style="display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;color:var(--text-secondary);">' +
      '<div style="width:6px;height:6px;border-radius:50%;background:var(--accent-blue);flex-shrink:0;"></div>' +
      '<span style="font-weight:600;color:var(--text-primary);">' + name + '</span>' +
      '<span style="color:var(--text-muted);">' + role + '</span></div>';
  }).join('');
  const moreReports = reports.length > 4 ? '<div style="font-size:13px;color:var(--text-muted);padding-left:12px;">+ ' + (reports.length - 4) + ' more</div>' : '';

  // Compliance countdown items
  let complianceCountdownHtml = '<div class="countdown-row">';
  if (hasCobra) complianceCountdownHtml += '<div class="countdown-card"><div class="cd-title">COBRA Notice</div><div class="cd-date">Feb 20, 2026</div><div class="cd-days" style="color:var(--accent-red);">14 days</div></div>';
  complianceCountdownHtml += '<div class="countdown-card"><div class="cd-title">Final Paycheck</div><div class="cd-date">Feb 12, 2026</div><div class="cd-days" style="color:var(--accent-red);">6 days</div></div>';
  if (equity) complianceCountdownHtml += '<div class="countdown-card"><div class="cd-title">Equity Exercise</div><div class="cd-date">May 7, 2026</div><div class="cd-days" style="color:var(--accent-yellow);">90 days</div></div>';
  complianceCountdownHtml += '</div>';

  // Pipeline section
  let pipelineHtml = '';
  if (candidateNodes.length > 0) {
    pipelineHtml = candidateNodes.slice(0, 3).map(c => {
      const cn = c.node.properties;
      const stage = c.meta.stage || cn.status || 'unknown';
      const stageClass = stage === 'offer' ? 'offer' : 'interview';
      return '<div class="candidate-card"><div><div class="c-name">' + cn.name + '</div><div class="c-role">' + (cn.appliedRole || 'Engineer') + '</div></div><div class="c-stage ' + stageClass + '">' + stage + '</div></div>';
    }).join('');
    if (ic3Reports.length > 0) {
      pipelineHtml += '<div style="margin-top:8px;font-size:13px;color:var(--accent-purple);">Internal: ' + prop(ic3Reports[0], 'name') + ' (promotion candidate)</div>';
    }
  } else {
    pipelineHtml = '<div class="impact-detail">No external candidates in pipeline.' +
      (ic3Reports.length > 0 ? ' <strong>' + prop(ic3Reports[0], 'name') + '</strong> is a strong internal promotion candidate.' : ' Consider posting the backfill position immediately.') + '</div>';
  }

  // Financial section
  let financialHtml = '';
  financialHtml += '<div class="stat-row"><span class="stat-label">Salary Freed</span><span class="stat-value">' + formatMoney(salaryAmt) + '/yr</span></div>';
  if (equity) {
    financialHtml += '<div class="stat-row"><span class="stat-label">Unvested Equity Returned</span><span class="stat-value">' + unvestedShares.toLocaleString() + ' shares</span></div>';
    financialHtml += '<div class="stat-row"><span class="stat-label">Unvested Value</span><span class="stat-value" style="color:var(--accent-green);">' + formatMoney(unvestedValue) + '</span></div>';
  }
  if (hasCobra) {
    const monthlyPremium = medicalPlan ? ((medicalPlan.properties.monthlyPremiumEmployee || 0) + (medicalPlan.properties.monthlyPremiumEmployer || 0)) : 900;
    financialHtml += '<div class="stat-row"><span class="stat-label">COBRA Cost (18 mo)</span><span class="stat-value" style="color:var(--accent-orange);">' + formatMoney(Math.round(monthlyPremium * 1.02 * 18)) + '</span></div>';
  }
  financialHtml += '<div class="stat-row"><span class="stat-label">Backfill Band</span><span class="stat-value">' + (position ? formatMoney(position.properties.salaryBandMin || salaryAmt * 0.85) + ' - ' + formatMoney(position.properties.salaryBandMax || salaryAmt * 1.05) : 'N/A') + '</span></div>';

  el.innerHTML =
    '<div class="person-card animate-in">' +
      '<div class="person-avatar">' + (p.name || 'U').charAt(0) + '</div>' +
      '<div class="person-info">' +
        '<div class="person-name">' + p.name + '</div>' +
        '<div class="person-role">' + p.role + ' &middot; ' + (p.level || '') + ' &middot; ' + (p.location || '') + '</div>' +
        '<div class="person-stats">' +
          '<div><div class="person-stat-value">' + tenure + ' yr</div><div class="person-stat-label">Tenure</div></div>' +
          '<div><div class="person-stat-value">' + reports.length + '</div><div class="person-stat-label">Reports</div></div>' +
          '<div><div class="person-stat-value">' + formatMoney(totalComp) + '</div><div class="person-stat-label">Total Comp</div></div>' +
          '<div><div class="person-stat-value">' + projects.length + '</div><div class="person-stat-label">Projects</div></div>' +
          '<div><div class="person-stat-value">' + teams.length + '</div><div class="person-stat-label">Teams</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="departure-badge">Departing Feb 6</div>' +
    '</div>' +

    '<div class="agent-narrative animate-in" style="animation-delay:0.1s;">' +
      '<div class="agent-narrative-header">' +
        '<div class="agent-avatar">A</div>' +
        '<div class="agent-label">Executive Summary</div>' +
      '</div>' +
      '<div class="agent-summary">' +
        p.name + '\'s departure removes <span class="highlight">' + reports.length + ' direct reports</span> (' + pctHeadcount + '% of headcount) from their manager chain, ' +
        'creates <span class="urgent">' + (hasCobra ? '3+' : '2+') + ' compliance deadlines</span> starting in 6 days, and opens a ' +
        '<span class="highlight">' + formatMoney(totalComp) + ' total comp position</span> to backfill. ' +
        (candidateNodes.length > 0 ?
          '<span class="good">' + candidateNodes.length + ' candidates are already in pipeline</span>' +
          (offerCandidates.length > 0 ? ' -- ' + offerCandidates[0].node.properties.name + ' is at offer stage.' : '.') :
          'No pipeline candidates exist yet -- backfill posting should be immediate.') +
      '</div>' +
    '</div>' +

    '<div class="impact-sections animate-in" style="animation-delay:0.15s;">' +

      // Team Impact
      '<div class="impact-section">' +
        '<div class="impact-section-header">' +
          '<div class="impact-section-icon" style="background:var(--accent-purple-dim);color:var(--accent-purple);">&#9679;</div>' +
          '<div><div class="impact-section-title">Team Impact</div><div class="impact-section-subtitle">' + reports.length + ' people need reassignment</div></div>' +
        '</div>' +
        '<div class="impact-detail">' + managerName + '\'s span of control drops from <strong>' + (reports.length + 1) + '</strong> to <strong>0</strong> in this chain. ' + reports.length + ' reports need a new manager.</div>' +
        reportSnippet + moreReports +
        '<button class="impact-action-link" onclick="switchTab(\'restructuring\')">Plan Restructuring &#8594;</button>' +
      '</div>' +

      // Compliance Countdown
      '<div class="impact-section">' +
        '<div class="impact-section-header">' +
          '<div class="impact-section-icon" style="background:var(--accent-red-dim);color:var(--accent-red);">&#9888;</div>' +
          '<div><div class="impact-section-title">Compliance Countdown</div><div class="impact-section-subtitle">' + (hasCobra ? '3' : '2') + '+ deadlines identified</div></div>' +
        '</div>' +
        complianceCountdownHtml +

function buildActionCard(opts) {
  var draftHtml = opts.draft ? '<button class="action-draft-toggle">Show draft</button><div class="action-draft">' + opts.draft + '</div>' : '';
  var buttonsHtml = '';
  (opts.buttons || []).forEach(function(b) {
    if (b === 'approve') buttonsHtml += '<button class="action-btn approve">Approve & Send</button>';
    if (b === 'edit') buttonsHtml += '<button class="action-btn edit">Edit</button>';
    if (b === 'reject') buttonsHtml += '<button class="action-btn reject">Reject</button>';
    if (b === 'choose') {
      buttonsHtml += '<button class="action-btn choose approve">' + (opts.choiceLabel || 'Accept') + '</button>';
      buttonsHtml += '<button class="action-btn edit">' + (opts.altLabel || 'Choose Other') + '</button>';
    }
  });
  var iconSym = opts.icon === 'review' ? '&#9998;' : opts.icon === 'input' ? '?' : '&#10003;';
  return '<div class="action-card ' + opts.type + ' animate-in" style="animation-delay:' + (0.03 * opts.index) + 's;" data-status="' + opts.type + '">' +
    '<div class="action-card-header">' +
      '<div class="action-status-icon ' + opts.icon + '">' + iconSym + '</div>' +
      '<div class="action-card-title">' + opts.title + '</div>' +
      '<div class="action-card-label ' + opts.labelClass + '">' + opts.label + '</div>' +
    '</div>' +
    '<div class="action-agent-text">' + opts.text + '</div>' +
    draftHtml +
    (buttonsHtml ? '<div class="action-buttons">' + buttonsHtml + '</div>' : '') +
  '</div>';
}

function handleApprove(btn) {
  var card = btn.closest('.action-card');
  var buttonsDiv = card.querySelector('.action-buttons');
  buttonsDiv.innerHTML = '<span class="approve-check"><span class="check-icon">&#10003;</span> Approved</span>';
  card.classList.remove('ready', 'needs-input');
  card.classList.add('completed');
  card.dataset.status = 'completed';
  var label = card.querySelector('.action-card-label');
  if (label) { label.className = 'action-card-label done-label'; label.textContent = 'Completed'; }
  var icon = card.querySelector('.action-status-icon');
  if (icon) { icon.className = 'action-status-icon done'; icon.innerHTML = '&#10003;'; }
  updateProgress();
}

function updateProgress() {
  var allCards = document.querySelectorAll('#tab-offboarding .action-card');
  var total = allCards.length;
  var completed = document.querySelectorAll('#tab-offboarding .action-card.completed, #tab-offboarding .action-card.auto-done').length;
  var autoHandled = document.querySelectorAll('#tab-offboarding .action-card.auto-done').length;
  var manualApproved = completed - autoHandled;
  var countEl = document.getElementById('approvedCount');
  if (countEl) countEl.querySelector('.stat-num').textContent = manualApproved;
  var bar = document.getElementById('progressBar');
  if (bar) bar.style.width = Math.round((completed / total) * 100) + '%';
}

      '<div class="scenario-metrics">' +
        '<div class="scenario-metric"><div class="scenario-metric-value">' + (reports.length - 1) + '</div><div class="scenario-metric-label">New Span</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">$0</div><div class="scenario-metric-label">Hiring Cost</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">1 week</div><div class="scenario-metric-label">Time to Fill</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">High</div><div class="scenario-metric-label">Continuity</div></div>' +
      '</div>' +
      '<div class="scenario-risk"><span class="risk-badge medium">Medium Risk</span></div>' +
      '<div class="scenario-risk-text">' + (promoCandidateName ? promoCandidateName.split(' ')[0] : 'Candidate') + ' has no prior management experience. May need coaching budget and mentorship from ' + managerName.split(' ')[0] + '.</div>' +
    '</div>' +

    // Scenario B: Split
    '<div class="scenario-card animate-in" style="animation-delay:0.15s;" data-scenario="split" onclick="selectScenario(this)">' +
      '<div class="scenario-card-top">' +
        '<div class="scenario-badge" style="background:var(--accent-orange-dim);color:var(--accent-orange);">B</div>' +
        '<div><h4>Distribute Reports to Peers</h4></div>' +
      '</div>' +
      '<div class="scenario-reasoning">' +
        'Split ' + reports.length + ' reports across ' + managerName + ' and ' + peerManagerName + '. Platform engineers go to ' + managerName.split(' ')[0] + ', DevOps engineers to ' + peerManagerName.split(' ')[0] + '. No single manager overloaded.' +
      '</div>' +
      '<div class="scenario-comparison">' +
        '<div class="scenario-before">' + beforeA + '</div>' +
        '<div class="scenario-after">' + afterB + '</div>' +
      '</div>' +
      '<div class="scenario-metrics">' +
        '<div class="scenario-metric"><div class="scenario-metric-value">' + Math.ceil(reports.length/2) + '/' + Math.floor(reports.length/2) + '</div><div class="scenario-metric-label">Split</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">$0</div><div class="scenario-metric-label">Hiring Cost</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">Immediate</div><div class="scenario-metric-label">Time to Fill</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">Low</div><div class="scenario-metric-label">Continuity</div></div>' +
      '</div>' +
      '<div class="scenario-risk"><span class="risk-badge high">High Risk</span></div>' +
      '<div class="scenario-risk-text">' + reports.length + ' people get new managers simultaneously during an already unsettled transition. Team identity may fragment and cross-functional context is lost.</div>' +
    '</div>' +

    // Scenario C: External Hire
    '<div class="scenario-card animate-in" style="animation-delay:0.2s;" data-scenario="hire" onclick="selectScenario(this)">' +
      '<div class="scenario-card-top">' +
        '<div class="scenario-badge" style="background:var(--accent-cyan-dim);color:var(--accent-cyan);">C</div>' +
        '<div><h4>External Hire + Interim Plan</h4></div>' +
      '</div>' +
      '<div class="scenario-reasoning">' +
        managerName + ' takes interim management of all ' + reports.length + ' reports. Post backfill immediately. ' +
        (offerCandidates.length > 0 ? offerCandidates[0].node.properties.name + ' (at offer stage) could be evaluated for the leadership track.' : 'Pipeline candidates could be fast-tracked if any demonstrate leadership potential.') +
      '</div>' +
      '<div class="scenario-comparison">' +
        '<div class="scenario-before">' + beforeA + '</div>' +
        '<div class="scenario-after">' + afterC + '</div>' +
      '</div>' +
      '<div class="scenario-metrics">' +
        '<div class="scenario-metric"><div class="scenario-metric-value">' + (reports.length + currentManagerSpan - 1) + '</div><div class="scenario-metric-label">Interim Span</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">$30-60K</div><div class="scenario-metric-label">Hiring Cost</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">45-60 days</div><div class="scenario-metric-label">Time to Fill</div></div>' +
        '<div class="scenario-metric"><div class="scenario-metric-value">Medium</div><div class="scenario-metric-label">Continuity</div></div>' +
      '</div>' +
      '<div class="scenario-risk"><span class="risk-badge medium">Medium Risk</span></div>' +
      '<div class="scenario-risk-text">' + managerName.split(' ')[0] + ' temporarily manages ' + (reports.length + currentManagerSpan - 1) + ' people. Requires aggressive hiring timeline and strong interim support.</div>' +
    '</div>' +

    '</div>' +

    '<div class="decision-area animate-in" style="animation-delay:0.25s;" id="decisionArea">' +
      '<p>Select a scenario above to see the execution plan.</p>' +
    '</div>' +

    '<div class="execution-plan" id="executionPlan">' +
      '<h4><span class="agent-avatar" style="width:20px;height:20px;font-size:12px;">A</span> Execution Plan</h4>' +
      '<div id="executionSteps"></div>' +
    '</div>' +

    '<div class="graph-advantage animate-in" style="animation-delay:0.3s;">' +
      '<div class="graph-advantage-header">' +
        '<div class="graph-advantage-icon">G</div>' +
        '<div class="graph-advantage-label">Why this requires the employee graph</div>' +
      '</div>' +
      '<p>The graph knows who reports to ' + p.name + ', their roles and tenure, peer managers and their current span of control, and which candidates are in pipeline. It also knows each person\'s project allocations, skill profiles, and mentoring relationships -- all factors in restructuring decisions. A traditional HRIS would require manually looking up each of these across 4+ different screens.</p>' +
    '</div>';
}

function selectScenario(card) {
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  const scenario = card.dataset.scenario;
  const area = document.getElementById('decisionArea');
  const plan = document.getElementById('executionPlan');
  const steps = document.getElementById('executionSteps');

  area.innerHTML = '<p style="color:var(--accent-green);font-weight:600;">Scenario selected. Ready to execute?</p>' +
    '<div class="action-buttons"><button class="action-btn approve" onclick="executeScenario()">Execute This Plan</button><button class="action-btn edit" onclick="clearScenario()">Reconsider</button></div>';

  const personId = document.getElementById('personSelect').value;
  const person = getNode(personId);
  const managerId = getManager(personId);
  const managerName = getNode(managerId) ? getNode(managerId).properties.name : 'Manager';
  const reports = getDirectReports(personId);

  let stepsHtml = '';
  if (scenario === 'promote') {
    const ic3s = reports.filter(r => prop(r, 'level') === 'IC-3').sort((a,b) => new Date(prop(a,'startDate')) - new Date(prop(b,'startDate')));
    const promName = ic3s[0] ? prop(ic3s[0], 'name') : 'Senior IC';
    stepsHtml = [
      'Update ' + promName + '\'s title to ' + person.properties.role + ' and level to ' + person.properties.level,
      'Reassign ' + (reports.length - 1) + ' reports from ' + person.properties.name + ' to ' + promName,
      'Schedule announcement to the team within 24 hours',
      'Create management coaching plan for ' + promName.split(' ')[0],
      'Redistribute ' + promName.split(' ')[0] + '\'s current IC work to team members'
    ].map(function(s, i) { return '<div class="execution-step"><div class="execution-step-num">' + (i+1) + '</div><div>' + s + '</div></div>'; }).join('');
  } else if (scenario === 'split') {
    stepsHtml = [
      'Identify optimal split based on role types and project alignment',
      'Reassign platform engineers to ' + managerName,
      'Reassign DevOps engineers to peer manager',
      'Notify all ' + reports.length + ' affected people with new reporting assignments',
      'Schedule transition 1-on-1s with new managers',
      'Update team channels, meeting invites, and access groups'
    ].map(function(s, i) { return '<div class="execution-step"><div class="execution-step-num">' + (i+1) + '</div><div>' + s + '</div></div>'; }).join('');
  } else {
    stepsHtml = [
      'Assign all ' + reports.length + ' reports to ' + managerName + ' as interim manager',
      'Post backfill position immediately (draft already prepared)',
      'Schedule team meeting with ' + managerName + ' to address transition',
      'Fast-track pipeline candidates for leadership evaluation',
      'Set 45-day review checkpoint for interim arrangement'
    ].map(function(s, i) { return '<div class="execution-step"><div class="execution-step-num">' + (i+1) + '</div><div>' + s + '</div></div>'; }).join('');
  }
  steps.innerHTML = stepsHtml;
  plan.classList.add('visible');
}

function executeScenario() {
  document.getElementById('decisionArea').innerHTML = '<p><span class="approve-check"><span class="check-icon">&#10003;</span> Plan approved and executing. Updates will be applied within the hour.</span></p>';
}

function clearScenario() {
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('decisionArea').innerHTML = '<p>Select a scenario above to see the execution plan.</p>';
  document.getElementById('executionPlan').classList.remove('visible');
}

/* ============================================================
   TAB 4: COMPLIANCE TIMELINE
   ============================================================ */
function buildComplianceTab(ctx) {
  const { personId, p, reports, dependents, depBenefitsList, jurisdictions, jurisdictionNames,
    hasTexas, equity, salary, benefits, hasCobra, depNames, medicalPlan, managerName } = ctx;

  const el = document.getElementById('tab-compliance');
  const depRelationship = depBenefitsList.length > 0 && depBenefitsList[0].dep ? depBenefitsList[0].dep.properties.relationship : 'dependent';

  // Build compliance items
  var items = [];

  if (hasTexas) {
    items.push({
      title: 'Final Paycheck', date: 'February 12, 2026', days: 6, color: 'red',
      desc: 'TX Labor Code 61.014 requires payment within 6 days of separation. <span class="done-text">Flagged payroll to include ' + p.name + ' in the February 12 run</span> with prorated salary, accrued PTO, and pending reimbursements.',
      legal: 'Texas Labor Code 61.014', owner: 'Payroll', status: 'Flagged'
    });
  }

  if (hasCobra) {
    var monthlyPremium = medicalPlan ? ((medicalPlan.properties.monthlyPremiumEmployee || 0) + (medicalPlan.properties.monthlyPremiumEmployer || 0)) : 900;
    var cobraPremium = (monthlyPremium * 1.02).toFixed(2);
    items.push({
      title: 'COBRA Notice for ' + (depNames[0] || 'Dependent'), date: 'February 20, 2026', days: 14, color: 'red',
      desc: '29 USC 1166 requires 14-day employer notice for qualifying events. <span class="pending-text">Draft prepared for ' + (depNames[0] || 'dependent') + ' (' + depRelationship + ', family medical through ' + (medicalPlan ? medicalPlan.properties.name : 'Medical Plan') + ').</span> Monthly COBRA premium: $' + cobraPremium + '. Election period: 60 days.',
      legal: '29 USC 1166, COBRA Continuation Coverage', owner: 'Benefits', status: 'Draft ready',
      hasAction: true
    });
  }

  items.push({
    title: 'Benefits Coverage Ends', date: 'February 28, 2026', days: 22, color: 'yellow',
    desc: '<span class="done-text">Scheduled termination of ' + benefits.length + ' benefit enrollments</span> at end of month per plan terms.' + (depBenefitsList.length > 0 ? ' Dependent coverage for ' + depNames.join(', ') + ' also terminates -- COBRA election covers the gap.' : ''),
    legal: 'Plan SPD terms, ERISA 601-608', owner: 'Benefits', status: 'Scheduled'
  });

  if (equity) {
    var unvested = (equity.properties.totalShares || 0) - (equity.properties.vestedShares || 0);
    items.push({
      title: 'Equity Exercise Window Closes', date: 'May 7, 2026', days: 90, color: 'yellow',
      desc: p.name + ' has ' + (equity.properties.vestedShares || 0).toLocaleString() + ' vested shares eligible for exercise. <span class="pending-text">' + unvested.toLocaleString() + ' unvested shares (' + formatMoney(Math.round((equity.properties.amount / equity.properties.totalShares) * unvested)) + ') return to the company pool.</span> 90-day post-termination exercise window per grant agreement.',
      legal: 'Equity Grant Agreement, IRC 422 (ISO rules)', owner: 'Legal/Finance', status: 'Pending notification',
      hasAction: true
    });
  }

  items.push({
    title: 'Equipment Return', date: 'February 6, 2026', days: 0, color: 'green',
    desc: '<span class="done-text">Return request sent to IT for assigned devices.</span> Shipping label auto-generated. Tracking monitored and escalated if not received within 14 days.',
    legal: 'Company Property Policy', owner: 'IT', status: 'Auto-handled'
  });

  items.push({
    title: 'Access Revocation', date: 'February 6, 2026', days: 0, color: 'green',
    desc: '<span class="done-text">Scheduled deactivation of all accounts</span> (email, Slack, GitHub, AWS, VPN) at 5:00 PM on last day. Manager email archive retained for 30 days.',
    legal: 'Security Policy', owner: 'IT', status: 'Auto-handled'
  });

  items.push({
    title: 'W-2 Preparation', date: 'January 31, 2027', days: 359, color: 'gray',
    desc: '<span class="done-text">Queued for year-end processing.</span> Will include all compensation through separation date, PTO payout, and any equity exercise income.',
    legal: 'IRS Publication 15, 26 USC 6051', owner: 'Payroll', status: 'Queued'
  });

  var autoHandled = items.filter(i => i.color === 'green').length;
  var needsAction = items.filter(i => i.hasAction).length;
  var totalItems = items.length;

  // Timeline markers
  var timelineSpan = 365; // days range for visual axis
  var markersHtml = items.map(function(item) {
    var pct = Math.max(2, Math.min(98, (item.days / timelineSpan) * 100));
    return '<div class="timeline-marker ' + item.color + '" style="left:' + pct + '%;" title="' + item.title + '">' +
      '<div class="timeline-marker-label">' + item.date.replace(', 2026', '').replace(', 2027', ' \'27') + '</div>' +
    '</div>';
  }).join('');

  // Detail cards
  var cardsHtml = items.map(function(item) {
    var countdownText = item.days === 0 ? 'Done' : item.days + ' days';
    var actionHtml = '';
    if (item.hasAction) {
      actionHtml = '<div class="action-buttons" style="margin-top:8px;">' +
        '<button class="action-btn approve" onclick="handleComplianceApprove(this)">Approve</button>' +
        '<button class="action-btn edit">Review</button>' +
      '</div>';
    }
    return '<div class="compliance-card">' +
      '<div class="compliance-card-dot ' + item.color + '"></div>' +
      '<div>' +
        '<div class="compliance-card-title">' + item.title + '</div>' +
        '<div class="compliance-card-when">' + item.date + '</div>' +
        '<div class="compliance-card-desc">' + item.desc + '</div>' +
        '<div class="compliance-card-legal">' + item.legal + '</div>' +
        actionHtml +
      '</div>' +
      '<div class="compliance-card-meta">' +
        '<div class="compliance-card-countdown ' + item.color + '">' + countdownText + '</div>' +
        '<div class="compliance-card-owner">' + item.owner + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  el.innerHTML =
    '<div class="compliance-score animate-in">' +
      '<div class="compliance-score-circle" style="background:' + (needsAction > 0 ? 'var(--accent-yellow-dim);color:var(--accent-yellow)' : 'var(--accent-green-dim);color:var(--accent-green)') + ';">' + Math.round(((totalItems - needsAction) / totalItems) * 100) + '%</div>' +
      '<div class="compliance-score-info">' +
        '<div class="compliance-score-title">' + totalItems + ' Compliance Requirements Identified</div>' +
        '<div class="compliance-score-subtitle">' + autoHandled + ' auto-handled, ' + needsAction + ' need your sign-off' + (jurisdictionNames.length > 0 ? ' | Jurisdictions: ' + jurisdictionNames.join(', ') : '') + '</div>' +
        '<div class="compliance-score-breakdown">' +
          '<div class="compliance-score-item"><strong style="color:var(--accent-red);">' + items.filter(i => i.color === 'red').length + '</strong> Urgent</div>' +
          '<div class="compliance-score-item"><strong style="color:var(--accent-yellow);">' + items.filter(i => i.color === 'yellow').length + '</strong> This month</div>' +
          '<div class="compliance-score-item"><strong style="color:var(--accent-green);">' + autoHandled + '</strong> Handled</div>' +
          '<div class="compliance-score-item"><strong style="color:var(--text-muted);">' + items.filter(i => i.color === 'gray').length + '</strong> Future</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="timeline-visual animate-in" style="animation-delay:0.1s;">' +
      '<div class="timeline-axis">' +
        '<div class="timeline-line"></div>' +
        markersHtml +
      '</div>' +
    '</div>' +

    '<div class="compliance-cards animate-in" style="animation-delay:0.15s;">' +
      cardsHtml +
    '</div>' +

    '<div class="graph-advantage animate-in" style="animation-delay:0.25s;">' +
      '<div class="graph-advantage-header">' +
        '<div class="graph-advantage-icon">G</div>' +
        '<div class="graph-advantage-label">Why this requires the employee graph</div>' +
      '</div>' +
      '<p>These compliance requirements were identified by tracing ' + p.name + '\'s connections to jurisdictions (' + jurisdictionNames.join(', ') + '), benefits plans (' + benefits.map(function(b) { var n = getNode(b.id); return n ? n.properties.type : ''; }).filter(Boolean).filter(function(v,i,a) { return a.indexOf(v) === i; }).join(', ') + '), dependents (' + (depNames.join(', ') || 'none') + '), and compensation records. A traditional HRIS offboarding checklist is generic -- it cannot adapt to each person\'s specific situation. The graph builds a custom compliance plan for every departure by walking their actual relationships.</p>' +
    '</div>';
}

function handleComplianceApprove(btn) {
  var card = btn.closest('.compliance-card');
  var buttonsDiv = card.querySelector('.action-buttons');
  if (buttonsDiv) {
    buttonsDiv.innerHTML = '<span class="approve-check"><span class="check-icon">&#10003;</span> Approved</span>';
  }
  var dot = card.querySelector('.compliance-card-dot');
  if (dot) { dot.className = 'compliance-card-dot green'; }
  var countdown = card.querySelector('.compliance-card-countdown');
  if (countdown) { countdown.className = 'compliance-card-countdown green'; countdown.textContent = 'Done'; }
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  try {
    await loadData();
    populatePersonPicker();
    buildAllTabs('person-008');
    document.getElementById('loadingState').style.display = 'none';
  } catch (err) {
    console.error('Failed to load data:', err);
    document.getElementById('loadingState').innerHTML =
      '<div style="color:var(--accent-red);text-align:center;">' +
        '<p style="font-size:16px;font-weight:600;margin-bottom:8px;">Failed to load data</p>' +
        '<p style="font-size:15px;color:var(--text-muted);">Make sure you\'re serving from the project root.<br>Try: python3 -m http.server 8765</p>' +
        '<p style="font-size:13px;color:var(--text-muted);margin-top:8px;">' + err.message + '</p>' +
      '</div>';
  }
}

init();
</script>

     MAIN CONTENT
     ============================================================ -->
<div class="main-content">
  <div id="loadingState" class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">Analyzing organizational connections...</div>
  </div>

  <!-- ============================================================
       TAB A: AGENT BRIEFING
       ============================================================ -->
  <div class="tab-panel active" id="tab-briefing"></div>

  <!-- ============================================================
       TAB B: OFFBOARDING
       ============================================================ -->
  <div class="tab-panel" id="tab-offboarding"></div>

  <!-- ============================================================
       TAB C: RESTRUCTURING
       ============================================================ -->
  <div class="tab-panel" id="tab-restructuring"></div>

  <!-- ============================================================
       TAB D: COMPLIANCE
       ============================================================ -->
  <div class="tab-panel" id="tab-compliance"></div>

  <!-- ============================================================
       TAB E: IMPACT STORY
       ============================================================ -->
  <div class="tab-panel" id="tab-story"></div>
</div>

<script>
/* ============================================================
   DATA LOADING & GRAPH HELPERS
   ============================================================ */
let NODES = {};
let EDGES = [];
let ALL_NODES = [];

async function loadData() {
  const [nodesRes, edgesRes] = await Promise.all([
    fetch('../data/nodes.json'),
    fetch('../data/edges.json')
  ]);
  const nodesData = await nodesRes.json();
  const edgesData = await edgesRes.json();
  ALL_NODES = nodesData.nodes;
  EDGES = edgesData.edges;
  ALL_NODES.forEach(n => NODES[n.id] = n);
}

function getNode(id) { return NODES[id] || null; }
function prop(id, key) {
  const n = getNode(id);
  return n ? (n.properties || {})[key] : null;
}

function edgesFrom(nodeId, type) {
  return EDGES.filter(e => e.source === nodeId && (!type || e.type === type));
}
function edgesTo(nodeId, type) {
  return EDGES.filter(e => e.target === nodeId && (!type || e.type === type));
}

function getDirectReports(personId) {
  return edgesTo(personId, 'reports_to').map(e => e.source);
}
function getManager(personId) {
  const e = edgesFrom(personId, 'reports_to')[0];
  return e ? e.target : null;
}
function getDependents(personId) {
  return edgesFrom(personId, 'has_dependent').map(e => e.target);
}
function getBenefits(personId) {
  return edgesFrom(personId, 'has_benefits').map(e => ({ id: e.target, meta: e.metadata || {} }));
}
function getComp(personId) {
  return edgesFrom(personId, 'has_comp').map(e => e.target);
}
function getProjects(personId) {
  return edgesFrom(personId, 'works_on').map(e => ({ id: e.target, meta: e.metadata || {} }));
}
function getTeams(personId) {
  return edgesFrom(personId, 'member_of').filter(e => {
    const n = getNode(e.target);
    return n && n.type === 'team';
  }).map(e => ({ id: e.target, meta: e.metadata || {} }));
}
function getJurisdictions(personId) {
  return edgesFrom(personId, 'subject_to').map(e => e.target);
}
function getCandidatesForPosition(posId) {
  return EDGES.filter(e => e.type === 'candidate_for' && e.target === posId).map(e => ({
    id: e.source, meta: e.metadata || {}
  }));
}
function getPosition(personId) {
  const e = edgesFrom(personId, 'holds_position')[0];
  return e ? e.target : null;
}
function getDependentBenefits(depId) {
  return edgesFrom(depId, 'dependent_covered_by').map(e => e.target);
}
function getMentees(personId) {
  return edgesFrom(personId, 'mentors').map(e => e.target);
}
function getEquityComp(personId) {
  return getComp(personId).map(id => getNode(id)).filter(n => n && (n.properties || {}).type === 'equity')[0];
}
function getSalaryComp(personId) {
  return getComp(personId).map(id => getNode(id)).filter(n => n && (n.properties || {}).type === 'salary')[0];
}

function tenureYears(startDate) {
  const start = new Date(startDate);
  const now = new Date('2026-02-06');
  return ((now - start) / (365.25 * 24 * 60 * 60 * 1000)).toFixed(1);
}
function formatMoney(n) {
  return '$' + Number(n).toLocaleString();
}

// Count total active people
function totalActivePeople() {
  return ALL_NODES.filter(n => n.type === 'person' && (n.properties || {}).status === 'active').length;
}

/* ============================================================
   PERSON PICKER
   ============================================================ */
function populatePersonPicker() {
  const sel = document.getElementById('personSelect');
  const people = ALL_NODES.filter(n => n.type === 'person' && (n.properties || {}).status === 'active')
    .sort((a,b) => (a.properties.name || '').localeCompare(b.properties.name || ''));
  people.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.properties.name} - ${p.properties.role}`;
    if (p.id === 'person-008') opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => buildAllTabs(sel.value));
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ============================================================
   BUILD ALL TABS
   ============================================================ */
function buildAllTabs(personId) {
  const person = getNode(personId);
  if (!person) return;
  const p = person.properties;
  const reports = getDirectReports(personId);
  const managerId = getManager(personId);
  const manager = getNode(managerId);
  const managerName = manager ? manager.properties.name : 'Unknown';
  const dependents = getDependents(personId);
  const benefits = getBenefits(personId);
  const projects = getProjects(personId);
  const teams = getTeams(personId);
  const jurisdictions = getJurisdictions(personId);
  const positionId = getPosition(personId);
  const position = getNode(positionId);
  const equity = getEquityComp(personId);
  const salary = getSalaryComp(personId);
  const mentees = getMentees(personId);
  const total = totalActivePeople();

  // Get dependent benefits
  const depBenefitsList = [];
  dependents.forEach(dId => {
    const dep = getNode(dId);
    const depBens = getDependentBenefits(dId);
    depBenefitsList.push({ dep, benefits: depBens.map(b => getNode(b)).filter(Boolean) });
  });

  // Candidates for position
  const candidates = positionId ? getCandidatesForPosition(positionId) : [];
  const candidateNodes = candidates.map(c => ({ node: getNode(c.id), meta: c.meta })).filter(c => c.node);
  const offerCandidates = candidateNodes.filter(c => (c.meta.stage === 'offer' || (c.node.properties || {}).status === 'offer'));
  const interviewCandidates = candidateNodes.filter(c => c.meta.stage === 'interviewing' || (c.node.properties || {}).status === 'interviewing');

  const salaryAmt = salary ? salary.properties.amount : 0;
  const equityAmt = equity ? equity.properties.amount : 0;
  const totalComp = salaryAmt + equityAmt;
  const unvestedShares = equity ? (equity.properties.totalShares || 0) - (equity.properties.vestedShares || 0) : 0;
  const unvestedValue = equity ? Math.round((equityAmt / (equity.properties.totalShares || 1)) * unvestedShares) : 0;
  const pctHeadcount = total > 0 ? ((reports.length / total) * 100).toFixed(1) : '?';
  const tenure = tenureYears(p.startDate);

  // Count actions
  const actionCount = 3 + dependents.length + benefits.length + projects.length + teams.length;
  const clampedActions = Math.min(actionCount, 18);
  document.getElementById('offboardingBadge').textContent = clampedActions;

  // Determine compliance count
  const complianceItems = [];
  jurisdictions.forEach(jId => {
    const j = getNode(jId);
    if (j && j.properties.type === 'state') {
      complianceItems.push({ type: 'final_paycheck', jurisdiction: j.properties.name, jType: 'state' });
    }
  });
  if (depBenefitsList.some(d => d.benefits.some(b => b.properties.type === 'medical'))) {
    complianceItems.push({ type: 'cobra' });
  }
  if (equity) complianceItems.push({ type: 'equity' });
  complianceItems.push({ type: 'w2' });
  complianceItems.push({ type: 'equipment' });

  buildBriefingTab(personId, p, reports, managerName, dependents, depBenefitsList, candidateNodes, offerCandidates, unvestedShares, unvestedValue, equity, clampedActions, tenure, total, projects, teams);
  buildOffboardingTab(personId, p, reports, managerName, managerId, dependents, depBenefitsList, candidateNodes, offerCandidates, interviewCandidates, equity, salary, clampedActions, position, projects, benefits);
  buildRestructuringTab(personId, p, reports, managerName, managerId, candidateNodes, offerCandidates, tenure);
  buildComplianceTab(personId, p, reports, dependents, depBenefitsList, jurisdictions, equity, salary, benefits, complianceItems);
  buildStoryTab(personId, p, reports, managerName, managerId, dependents, depBenefitsList, candidateNodes, offerCandidates, unvestedShares, unvestedValue, equity, salary, tenure, total, projects, teams, clampedActions, complianceItems);
}

/* ============================================================
   TAB A: AGENT BRIEFING
   ============================================================ */
function buildBriefingTab(personId, p, reports, managerName, dependents, depBenefitsList, candidateNodes, offerCandidates, unvestedShares, unvestedValue, equity, actionCount, tenure, total, projects, teams) {
  const pctHeadcount = total > 0 ? ((reports.length / total) * 100).toFixed(1) : '?';
  const hasCobra = depBenefitsList.some(d => d.benefits.some(b => b.properties.type === 'medical'));
  const depNames = depBenefitsList.map(d => d.dep ? d.dep.properties.name : 'Unknown');

  const el = document.getElementById('tab-briefing');
  el.innerHTML = `
    <div class="alert-banner animate-in">
      <div class="alert-banner-row">
        <div class="alert-icon">!</div>
        <div class="alert-content">
          <h2>${p.name} submitted resignation</h2>
          <p>Effective date: February 6, 2026. I've analyzed the impact and prepared <strong>${actionCount} actions</strong>.</p>
          <div class="alert-meta">
            <div class="alert-meta-item"><strong>${p.role}</strong> &middot; ${p.level}</div>
            <div class="alert-meta-item"><strong>${tenure} years</strong> tenure</div>
            <div class="alert-meta-item"><strong>${reports.length} direct reports</strong></div>
            <div class="alert-meta-item">${p.location}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="agent-narrative animate-in" style="animation-delay: 0.1s;">
      <div class="agent-narrative-header">
        <div class="agent-avatar">A</div>
        <div class="agent-label">Agent Assessment</div>
      </div>
      <div class="narrative-item">
        <div class="narrative-bullet"></div>
        <div>${p.name} manages <span class="highlight">${reports.length} engineers</span> ${reports.length >= 10 ? '-- one of the largest teams in Engineering' : ''}. ${reports.length >= 8 ? 'This departure creates a significant single-point-of-failure gap in the department.' : 'This team will need interim leadership.'}</div>
      </div>
      ${hasCobra ? `
      <div class="narrative-item">
        <div class="narrative-bullet"></div>
        <div>I found <span class="urgent">${depBenefitsList.length + 2} compliance deadlines</span>, the most urgent being <span class="urgent">COBRA notice for ${depNames[0] || 'dependent'}</span> (family medical plan) -- due in 14 days under 29 USC 1166.</div>
      </div>
      ` : `
      <div class="narrative-item">
        <div class="narrative-bullet"></div>
        <div>I identified compliance deadlines including final paycheck and benefits termination that need attention.</div>
      </div>
      `}
      ${candidateNodes.length > 0 ? `
      <div class="narrative-item">
        <div class="narrative-bullet"></div>
        <div>There are <span class="good">${candidateNodes.length} candidates already in pipeline</span> for matching positions.${offerCandidates.length > 0 ? ` ${offerCandidates.map(c => c.node.properties.name).join(', ')} ${offerCandidates.length === 1 ? 'is' : 'are'} at offer stage.` : ''}</div>
      </div>
      ` : ''}
      ${equity ? `
      <div class="narrative-item">
        <div class="narrative-bullet"></div>
        <div>Equity: <span class="highlight">${unvestedShares.toLocaleString()} unvested shares</span> (${formatMoney(unvestedValue)} value) return to the pool. 90-day exercise window begins on last day.</div>
      </div>
      ` : ''}
      <div class="narrative-item">
        <div class="narrative-bullet"></div>
        <div>${p.name} is active on <span class="highlight">${projects.length} projects</span> and ${teams.length} team${teams.length !== 1 ? 's' : ''}. Work allocation and knowledge transfer need immediate planning.</div>
      </div>
    </div>

    <div class="quick-actions animate-in" style="animation-delay: 0.2s;">
      <button class="quick-action-btn primary" onclick="switchTab('offboarding')">Start Offboarding</button>
      <button class="quick-action-btn" onclick="switchTab('restructuring')">Plan Restructuring</button>
      <button class="quick-action-btn" onclick="switchTab('compliance')">View Compliance</button>
      <button class="quick-action-btn" onclick="switchTab('story')">Impact Story</button>
    </div>

    <div class="graph-advantage animate-in" style="animation-delay: 0.3s;">
      <div class="graph-advantage-header">
        <div class="graph-advantage-icon">G</div>
        <div class="graph-advantage-label">Why this requires the employee graph</div>
      </div>
      <p>Traditional HRIS runs a static offboarding checklist. The employee graph discovered <strong>${actionCount} specific actions</strong> by walking ${p.name}'s relationships -- including ${hasCobra ? `a COBRA deadline for ${depNames[0] || 'their dependent'}'s coverage that a checklist template wouldn't know about` : 'jurisdiction-specific compliance deadlines'}, and ${candidateNodes.length} pipeline candidates whose qualifications match the open position. A flat database can't connect person to dependent to benefits plan to jurisdiction to deadline in a single lookup.</p>
    </div>
  `;
}

/* ============================================================
   TAB B: OFFBOARDING
   ============================================================ */
function buildOffboardingTab(personId, p, reports, managerName, managerId, dependents, depBenefitsList, candidateNodes, offerCandidates, interviewCandidates, equity, salary, actionCount, position, projects, benefits) {
  const el = document.getElementById('tab-offboarding');
  const hasCobra = depBenefitsList.some(d => d.benefits.some(b => b.properties.type === 'medical'));
  const depNames = depBenefitsList.map(d => d.dep ? d.dep.properties.name : 'Unknown');
  const medicalBenefits = depBenefitsList.flatMap(d => d.benefits.filter(b => b.properties.type === 'medical'));
  const medicalPlan = medicalBenefits.length > 0 ? medicalBenefits[0] : null;
  const depRelationship = depBenefitsList.length > 0 && depBenefitsList[0].dep ? depBenefitsList[0].dep.properties.relationship : 'dependent';

  const posTitle = position ? position.properties.title : p.role;
  const salaryMin = position ? formatMoney(position.properties.salaryBandMin) : '?';
  const salaryMax = position ? formatMoney(position.properties.salaryBandMax) : '?';

  // Build report names for team notification
  const reportNames = reports.slice(0, 4).map(r => prop(r, 'name')).filter(Boolean);
  const moreCount = reports.length - reportNames.length;

  // Build action cards
  let cards = '';
  let cardIndex = 0;

  // Card 1: COBRA (if applicable)
  if (hasCobra) {
    const monthlyPremium = medicalPlan ? ((medicalPlan.properties.monthlyPremiumEmployee || 0) + (medicalPlan.properties.monthlyPremiumEmployer || 0)) : 900;
    const cobraPremium = (monthlyPremium * 1.02).toFixed(2);
    cards += buildActionCard({
      type: 'ready',
      icon: 'review',
      label: 'Ready for review',
      labelClass: 'review-label',
      title: `COBRA Notice for ${depNames[0] || 'Dependent'}`,
      text: `I've drafted the COBRA election notice for ${depNames[0]} (${depRelationship}, family medical plan through ${medicalPlan ? medicalPlan.properties.name : 'Medical'}). Monthly premium: $${cobraPremium} (102% of plan cost). Election deadline: April 7, 2026.`,
      draft: `<strong>COBRA Continuation Coverage Election Notice</strong><br><br>Dear ${depNames[0]},<br><br>Due to the qualifying event of ${p.name}'s separation from Acme Co. effective February 6, 2026, you are entitled to continue your group health coverage under COBRA (Consolidated Omnibus Budget Reconciliation Act).<br><br><strong>Covered Plans:</strong> ${medicalPlan ? medicalPlan.properties.name : 'Medical Plan'} (Family tier)<br><strong>Monthly Premium:</strong> $${cobraPremium}<br><strong>Election Deadline:</strong> April 7, 2026 (60 days from qualifying event)<br><strong>Coverage Duration:</strong> Up to 18 months<br><br>To elect COBRA continuation coverage, please complete the enclosed election form and return it by the deadline above. If you have questions, contact HR at benefits@acmeco.com.`,
      buttons: ['approve', 'edit', 'reject'],
      index: cardIndex++
    });
  }

  // Card 2: Team Notification
  cards += buildActionCard({
    type: 'ready',
    icon: 'review',
    label: 'Ready for review',
    labelClass: 'review-label',
    title: `Team Notification Email`,
    text: `I've drafted an email to ${p.name}'s ${reports.length} direct reports informing them of the transition. The tone is reassuring and focuses on continuity. You may want to review it for sensitivity.`,
    draft: `<strong>Subject:</strong> Team Update -- Leadership Transition<br><br>Hi team,<br><br>I'm writing to let you know that ${p.name} has decided to move on from Acme Co., with their last day being February 6, 2026. We're grateful for ${p.name}'s contributions over the past ${tenureYears(p.startDate)} years, particularly in leading our platform engineering work.<br><br>I want to assure you that we have a transition plan in place. Your day-to-day work continues as normal, and we'll be announcing interim reporting arrangements within the next 48 hours. I'll be scheduling 1-on-1s with each of you this week to answer any questions.<br><br>In the meantime, please don't hesitate to reach out to me directly.<br><br>Best,<br>${managerName}`,
    buttons: ['approve', 'edit', 'reject'],
    index: cardIndex++
  });

  // Card 3: Reassign Reports (needs input)
  cards += buildActionCard({
    type: 'needs-input',
    icon: 'input',
    label: 'Needs your input',
    labelClass: 'input-label',
    title: `Reassign ${reports.length} Direct Reports`,
    text: `I need your input: Who should ${p.name}'s ${reports.length} reports temporarily report to? I suggest <strong>${managerName}</strong> (${p.name}'s current manager, already oversees this area) as interim. This keeps the chain intact while we hire.`,
    buttons: ['choose'],
    choiceLabel: `Accept ${managerName.split(' ')[0]}`,
    altLabel: 'Choose Someone Else',
    index: cardIndex++
  });

  // Card 4: Post Backfill (if position exists)
  if (position) {
    cards += buildActionCard({
      type: 'ready',
      icon: 'review',
      label: 'Ready for review',
      labelClass: 'review-label',
      title: `Post Backfill Position`,
      text: `I've drafted a job posting based on the ${posTitle} position. Salary band: ${salaryMin}--${salaryMax}. ${candidateNodes.length > 0 ? `Note: ${candidateNodes.length} candidates are already in pipeline for this role family.` : ''}`,
      draft: `<strong>${posTitle} -- ${position.properties.department || 'Engineering'}</strong><br><br><strong>Location:</strong> ${p.location}<br><strong>Level:</strong> ${position.properties.level || p.level}<br><strong>Salary Range:</strong> ${salaryMin} - ${salaryMax}<br><br>We're looking for an experienced engineer to lead our platform engineering team of ${reports.length}. You'll own the technical direction for API architecture, observability, CI/CD, and deployment infrastructure.<br><br><strong>What you'll do:</strong><br>- Lead a team of ${reports.length} engineers across platform and DevOps<br>- Drive technical strategy for core infrastructure<br>- Partner with product engineering on reliability and developer experience<br><br><strong>What we're looking for:</strong><br>- 5+ years of engineering experience, 2+ years in a leadership role<br>- Strong background in distributed systems and infrastructure<br>- Experience mentoring and growing engineering talent`,
      buttons: ['approve', 'edit'],
      index: cardIndex++
    });
  }

  // Card 5: Equipment Return
  cards += buildActionCard({
    type: 'auto-done',
    icon: 'auto',
    label: 'Auto-handled',
    labelClass: 'auto-label',
    title: `Equipment Return Request`,
    text: `Sent automated return request to IT for ${p.name}'s assigned devices. Return shipping label will be generated on their last day.`,
    buttons: [],
    index: cardIndex++
  });

  // Card 6: Access Revocation
  cards += buildActionCard({
    type: 'auto-done',
    icon: 'auto',
    label: 'Auto-handled',
    labelClass: 'auto-label',
    title: `Access Revocation Scheduled`,
    text: `Scheduled deactivation of ${p.name}'s accounts (email, Slack, GitHub, AWS) for 5:00 PM on their last day. Manager will retain access to email archive for 30 days.`,
    buttons: [],
    index: cardIndex++
  });

  // Card 7: Knowledge Transfer
  cards += buildActionCard({
    type: 'ready',
    icon: 'review',
    label: 'Ready for review',
    labelClass: 'review-label',
    title: `Knowledge Transfer Plan`,
    text: `I've identified ${projects.length} active projects that need knowledge transfer. I've drafted a handoff schedule with sessions for each project, prioritized by deadline proximity. The API Refactor (high priority, due May 2026) should be transferred first.`,
    draft: `<strong>Knowledge Transfer Schedule</strong><br><br>${projects.map((proj, i) => {
      const pNode = getNode(proj.id);
      const pName = pNode ? pNode.properties.name : 'Project';
      const priority = pNode ? pNode.properties.priority : 'medium';
      return `<strong>${i+1}. ${pName}</strong> (${priority} priority)<br>&nbsp;&nbsp;Role: ${proj.meta.role || 'contributor'} | Allocation: ${proj.meta.allocation || '?'}%<br>&nbsp;&nbsp;Handoff session: Week of Feb 3, 2026<br>`;
    }).join('<br>')}`,
    buttons: ['approve', 'edit'],
    index: cardIndex++
  });

  // Card 8: Equity Exercise Window
  if (equity) {
    const unvested = (equity.properties.totalShares || 0) - (equity.properties.vestedShares || 0);
    cards += buildActionCard({
      type: 'ready',
      icon: 'review',
      label: 'Ready for review',
      labelClass: 'review-label',
      title: `Equity Exercise Window Notification`,
      text: `${p.name} has ${(equity.properties.vestedShares || 0).toLocaleString()} vested shares and ${unvested.toLocaleString()} unvested shares. The 90-day post-termination exercise window begins on their last day. I've drafted the notification with exercise instructions.`,
      buttons: ['approve', 'edit'],
      index: cardIndex++
    });
  }

  // Card 9: Final Paycheck
  cards += buildActionCard({
    type: 'auto-done',
    icon: 'auto',
    label: 'Auto-handled',
    labelClass: 'auto-label',
    title: `Final Paycheck Processing`,
    text: `Flagged payroll to include ${p.name} in the February 12 run with prorated salary through last day, plus accrued PTO payout. Texas requires payment within 6 days of separation.`,
    buttons: [],
    index: cardIndex++
  });

  // Card 10: Benefits Termination
  cards += buildActionCard({
    type: 'auto-done',
    icon: 'auto',
    label: 'Auto-handled',
    labelClass: 'auto-label',
    title: `Benefits Termination`,
    text: `Scheduled termination of ${benefits.length} benefit enrollments (medical, dental, vision, life insurance) effective end of February 2026. COBRA election notice being sent separately.`,
    buttons: [],
    index: cardIndex++
  });

  const autoCount = cards.split('auto-done').length - 1;
  const reviewCount = cards.split('"ready"').length - 1;
  const inputCount = cards.split('needs-input').length - 1;

  el.innerHTML = `
    <div class="offboarding-progress animate-in">
      <div class="progress-stat">
        <div class="stat-num">${cardIndex}</div>
        <div class="stat-label">Actions</div>
      </div>
      <div class="progress-stat approved" id="approvedCount">
        <div class="stat-num">0</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="progress-stat urgent">
        <div class="stat-num">${inputCount}</div>
        <div class="stat-label">Need Input</div>
      </div>
      <div class="progress-stat" style="color: var(--accent-green);">
        <div class="stat-num">${autoCount}</div>
        <div class="stat-label">Auto-handled</div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar" style="width: ${Math.round((autoCount / cardIndex) * 100)}%"></div>
      </div>
    </div>

    <div class="action-feed" id="actionFeed">
      ${cards}
    </div>

    <div class="graph-advantage animate-in">
      <div class="graph-advantage-header">
        <div class="graph-advantage-icon">G</div>
        <div class="graph-advantage-label">Why this requires the employee graph</div>
      </div>
      <p>I discovered these ${cardIndex} actions by tracing ${p.name}'s connections across 7 domains -- reporting chain, benefits, compensation, compliance, equipment, pipeline, and documents. A static offboarding template covers about 60% of these. The graph found the other 40% -- like the ${depBenefitsList.length > 0 ? `COBRA notice for ${depBenefitsList[0].dep ? depBenefitsList[0].dep.properties.name : 'dependents'}` : 'dependent coverage requirements'} and the equity exercise window -- by walking relationships automatically.</p>
    </div>
  `;

  // Wire up approve buttons
  el.querySelectorAll('.action-btn.approve').forEach(btn => {
    btn.addEventListener('click', function() {
      handleApprove(this);
    });
  });
  el.querySelectorAll('.action-btn.choose').forEach(btn => {
    btn.addEventListener('click', function() {
      handleApprove(this);
    });
  });
  el.querySelectorAll('.action-draft-toggle').forEach(btn => {
    btn.addEventListener('click', function() {
      const draft = this.nextElementSibling;
      draft.classList.toggle('expanded');
      this.textContent = draft.classList.contains('expanded') ? 'Hide draft' : 'Show draft';
    });
  });
}

function buildActionCard({ type, icon, label, labelClass, title, text, draft, buttons, choiceLabel, altLabel, index }) {
  const draftHtml = draft ? `
    <button class="action-draft-toggle">Show draft</button>
    <div class="action-draft">${draft}</div>
  ` : '';

  let buttonsHtml = '';
  buttons.forEach(b => {
    if (b === 'approve') buttonsHtml += `<button class="action-btn approve">Approve & Send</button>`;
    if (b === 'edit') buttonsHtml += `<button class="action-btn edit">Edit</button>`;
    if (b === 'reject') buttonsHtml += `<button class="action-btn reject">Reject</button>`;
    if (b === 'choose') {
      buttonsHtml += `<button class="action-btn choose approve">${choiceLabel || 'Accept'}</button>`;
      buttonsHtml += `<button class="action-btn edit">${altLabel || 'Choose Other'}</button>`;
    }
  });

  const iconSymbol = icon === 'review' ? '&#9998;' : icon === 'input' ? '?' : icon === 'auto' ? '&#10003;' : '&#10003;';

  return `
    <div class="action-card ${type} animate-in" style="animation-delay: ${0.05 * index}s;" data-status="${type}">
      <div class="action-card-header">
        <div class="action-status-icon ${icon}">${iconSymbol}</div>
        <div class="action-card-title">${title}</div>
        <div class="action-card-label ${labelClass}">${label}</div>
      </div>
      <div class="action-agent-text">${text}</div>
      ${draftHtml}
      ${buttonsHtml ? `<div class="action-buttons">${buttonsHtml}</div>` : ''}
    </div>
  `;
}

function handleApprove(btn) {
  const card = btn.closest('.action-card');
  const buttonsDiv = card.querySelector('.action-buttons');
  buttonsDiv.innerHTML = `<span class="approve-check"><span class="check-icon">&#10003;</span> Approved</span>`;
  card.classList.remove('ready', 'needs-input');
  card.classList.add('completed');
  card.dataset.status = 'completed';

  // Update label
  const label = card.querySelector('.action-card-label');
  if (label) {
    label.className = 'action-card-label done-label';
    label.textContent = 'Completed';
  }
  const icon = card.querySelector('.action-status-icon');
  if (icon) {
    icon.className = 'action-status-icon done';
    icon.innerHTML = '&#10003;';
  }

  // Update progress
  updateProgress();
}

function updateProgress() {
  const feed = document.getElementById('actionFeed');
  if (!feed) return;
  const cards = feed.querySelectorAll('.action-card');
  const total = cards.length;
  const completed = feed.querySelectorAll('.action-card.completed, .action-card.auto-done').length;
  const approved = feed.querySelectorAll('.action-card.completed').length - feed.querySelectorAll('.action-card.auto-done.completed').length;
  const autoHandled = feed.querySelectorAll('.action-card.auto-done').length;
  const manualApproved = completed - autoHandled;

  const countEl = document.getElementById('approvedCount');
  if (countEl) countEl.querySelector('.stat-num').textContent = manualApproved;

  const bar = document.getElementById('progressBar');
  if (bar) bar.style.width = Math.round((completed / total) * 100) + '%';
}

/* ============================================================
   TAB C: RESTRUCTURING
   ============================================================ */
function buildRestructuringTab(personId, p, reports, managerName, managerId, candidateNodes, offerCandidates, tenure) {
  const el = document.getElementById('tab-restructuring');
  const manager = getNode(managerId);

  // Categorize reports
  const ic3Reports = reports.filter(r => prop(r, 'level') === 'IC-3');
  const ic2Reports = reports.filter(r => prop(r, 'level') === 'IC-2');
  const devOpsReports = reports.filter(r => (prop(r, 'role') || '').toLowerCase().includes('devops'));
  const platformReports = reports.filter(r => (prop(r, 'role') || '').toLowerCase().includes('platform'));
  const engReports = reports.filter(r => {
    const role = (prop(r, 'role') || '').toLowerCase();
    return role === 'engineer' || role === 'software engineer';
  });

  // Find a senior IC among reports for promotion candidate
  const promoCandidate = ic3Reports.sort((a, b) => {
    return new Date(prop(a, 'startDate')) - new Date(prop(b, 'startDate'));
  })[0];
  const promoCandidateName = promoCandidate ? prop(promoCandidate, 'name') : null;
  const promoCandidateTenure = promoCandidate ? tenureYears(prop(promoCandidate, 'startDate')) : '?';
  const promoCandidateRole = promoCandidate ? prop(promoCandidate, 'role') : '';

  // Derek Lin special case
  const derekId = reports.find(r => prop(r, 'name') === 'Derek Lin');
  const mentees = getMentees(personId);

  // Peer managers
  const managerReports = managerId ? getDirectReports(managerId).filter(r => r !== personId) : [];
  const peerManagers = managerReports.filter(r => {
    const level = prop(r, 'level');
    return level && level.startsWith('M');
  });

  // Build report list for org tree
  const reportItems = reports.slice(0, 14).map(r => {
    const name = prop(r, 'name') || 'Unknown';
    const role = prop(r, 'role') || '';
    const level = prop(r, 'level') || '';
    const start = prop(r, 'startDate') || '';
    const yrs = start ? tenureYears(start) : '?';
    return `<div class="tree-node report"><span class="tree-node-name">${name}</span><span class="tree-node-role">${role} (${level}) &middot; ${yrs}yr</span></div>`;
  }).join('');

  el.innerHTML = `
    <div class="context-bar animate-in">
      <strong>${p.name}</strong>'s departure affects <strong>${reports.length} direct reports</strong>. Let's plan the transition together.
    </div>

    <div class="org-tree animate-in" style="animation-delay: 0.1s;">
      <h3>Current Structure</h3>
      <div class="tree-node manager">
        <span class="tree-node-name">${managerName}</span>
        <span class="tree-node-role">${manager ? manager.properties.role : ''} (${manager ? manager.properties.level : ''})</span>
      </div>
      <div class="tree-connector"></div>
      <div class="tree-node departing">
        <span class="tree-node-name">${p.name}</span>
        <span class="tree-node-role">${p.role} (${p.level}) -- DEPARTING</span>
      </div>
      <div class="tree-connector"></div>
      ${reportItems}
    </div>

    <div class="agent-narrative animate-in" style="animation-delay: 0.15s;">
      <div class="agent-narrative-header">
        <div class="agent-avatar">A</div>
        <div class="agent-label">I've prepared three scenarios</div>
      </div>
      <div class="narrative-item">
        <div class="narrative-bullet"></div>
        <div>Based on the team composition (${ic3Reports.length} senior ICs, ${ic2Reports.length} junior ICs, ${devOpsReports.length} DevOps specialists), current manager spans, and pipeline candidates, here are three approaches. Pick one and I'll handle the execution.</div>
      </div>
    </div>

    <div class="scenarios-grid animate-in" style="animation-delay: 0.2s;">
      <div class="scenario-card" data-scenario="promote" onclick="selectScenario(this)">
        <h4>Scenario A: Promote ${promoCandidateName || 'Senior IC'}</h4>
        <div class="scenario-reasoning">
          ${promoCandidateName ? `${promoCandidateName} has ${promoCandidateTenure} years tenure` : 'The most senior IC on the team has the longest tenure'}${promoCandidate && promoCandidateRole.includes('DevOps') ? ', deep infrastructure expertise,' : ','} and is already ${derekId ? 'being mentored by ' + p.name : 'familiar with team dynamics'}. Promoting from within maintains team continuity and shows a path for growth.
        </div>
        <div class="scenario-detail"><strong>Impact:</strong> ${reports.length - 1} reports under new lead. Their current projects may need redistribution.</div>
        <div class="scenario-risk">Risk: ${promoCandidateName ? promoCandidateName.split(' ')[0] : 'Candidate'} ${promoCandidate && prop(promoCandidate, 'level') === 'IC-3' ? 'hasn\'t managed before' : 'is relatively junior'}. May need management coaching budget.</div>
      </div>

      <div class="scenario-card" data-scenario="split" onclick="selectScenario(this)">
        <h4>Scenario B: Split the Team</h4>
        <div class="scenario-reasoning">
          Redistribute reports across peer managers. ${managerName} absorbs the platform engineers (${platformReports.length + engReports.filter(r => ic3Reports.includes(r)).length} people), ${peerManagers.length > 0 ? prop(peerManagers[0], 'name') || 'a peer manager' : 'another manager'} takes the DevOps engineers (${devOpsReports.length} people), and ${ic2Reports.length} junior ICs spread across existing teams.
        </div>
        <div class="scenario-detail"><strong>Impact:</strong> No single manager overloaded. But team identity may fragment and cross-functional context is lost.</div>
        <div class="scenario-risk">Risk: ${reports.length} people get new managers simultaneously. Morale impact during an already unsettled transition.</div>
      </div>

      <div class="scenario-card" data-scenario="hire" onclick="selectScenario(this)">
        <h4>Scenario C: External Hire + Interim</h4>
        <div class="scenario-reasoning">
          ${managerName} takes interim management of all ${reports.length} reports. Post backfill immediately. ${offerCandidates.length > 0 ? `${offerCandidates[0].node.properties.name} (candidate, at offer stage) could be evaluated for the leadership track if scope is adjusted.` : 'Pipeline candidates could be fast-tracked if any demonstrate leadership potential.'}
        </div>
        <div class="scenario-detail"><strong>Timeline:</strong> Estimated 45-60 days to fill based on current pipeline velocity.</div>
        <div class="scenario-risk">Risk: ${managerName.split(' ')[0]} temporarily manages ${reports.length + (managerId ? getDirectReports(managerId).length - 1 : 0)} people. Requires aggressive hiring timeline.</div>
      </div>
    </div>

    <div class="decision-area animate-in" style="animation-delay: 0.25s;" id="decisionArea">
      <p>Which approach should we take? Select a scenario above.</p>
    </div>

    <div class="execution-plan" id="executionPlan">
      <h4><span class="agent-avatar" style="width:20px;height:20px;font-size:12px;">A</span> Execution Plan</h4>
      <div id="executionSteps"></div>
    </div>

    <div class="graph-advantage animate-in" style="animation-delay: 0.3s;">
      <div class="graph-advantage-header">
        <div class="graph-advantage-icon">G</div>
        <div class="graph-advantage-label">Why this requires the employee graph</div>
      </div>
      <p>The graph knows who reports to ${p.name}, what their roles and tenure are, who the peer managers are and their current span of control, and which candidates are in pipeline for similar positions. It also knows each person's project allocations, skill profiles, and mentoring relationships -- all factors in restructuring decisions. A traditional HRIS would require an HR admin to manually look up each of these across 4+ different screens and piece together the options themselves.</p>
    </div>
  `;
}

function selectScenario(card) {
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  const scenario = card.dataset.scenario;

  const area = document.getElementById('decisionArea');
  const plan = document.getElementById('executionPlan');
  const steps = document.getElementById('executionSteps');

  area.innerHTML = `<p style="color: var(--accent-green); font-weight: 600;">Scenario selected. Ready to execute?</p>
    <div class="action-buttons">
      <button class="action-btn approve" onclick="executeScenario()">Execute This Plan</button>
      <button class="action-btn edit" onclick="clearScenario()">Reconsider</button>
    </div>`;

  // Show plan preview
  const personId = document.getElementById('personSelect').value;
  const person = getNode(personId);
  const managerId = getManager(personId);
  const managerName = getNode(managerId) ? getNode(managerId).properties.name : 'Manager';
  const reports = getDirectReports(personId);

  let stepsHtml = '';
  if (scenario === 'promote') {
    const ic3s = reports.filter(r => prop(r, 'level') === 'IC-3').sort((a,b) => new Date(prop(a,'startDate')) - new Date(prop(b,'startDate')));
    const promName = ic3s[0] ? prop(ic3s[0], 'name') : 'Senior IC';
    stepsHtml = [
      `Update ${promName}'s title to ${person.properties.role} and level to ${person.properties.level}`,
      `Reassign ${reports.length - 1} reports from ${person.properties.name} to ${promName}`,
      `Schedule announcement to the team within 24 hours`,
      `Create management coaching plan for ${promName.split(' ')[0]}`,
      `Redistribute ${promName.split(' ')[0]}'s current IC work to team members`
    ].map((s, i) => `<div class="execution-step"><div class="execution-step-num">${i+1}</div><div>${s}</div></div>`).join('');
  } else if (scenario === 'split') {
    stepsHtml = [
      `Identify optimal split based on role types and project alignment`,
      `Reassign platform engineers to ${managerName}`,
      `Reassign DevOps engineers to peer manager`,
      `Notify all ${reports.length} affected people with new reporting assignments`,
      `Schedule transition 1-on-1s for each person with their new manager`,
      `Update team channels, meeting invites, and access groups`
    ].map((s, i) => `<div class="execution-step"><div class="execution-step-num">${i+1}</div><div>${s}</div></div>`).join('');
  } else {
    stepsHtml = [
      `Assign all ${reports.length} reports to ${managerName} as interim manager`,
      `Post backfill position immediately (draft already prepared)`,
      `Schedule team meeting with ${managerName} to address transition`,
      `Fast-track pipeline candidates for leadership evaluation`,
      `Set 45-day review checkpoint for interim arrangement`
    ].map((s, i) => `<div class="execution-step"><div class="execution-step-num">${i+1}</div><div>${s}</div></div>`).join('');
  }

  steps.innerHTML = stepsHtml;
  plan.classList.add('visible');
}

function executeScenario() {
  const area = document.getElementById('decisionArea');
  area.innerHTML = `<p><span class="approve-check"><span class="check-icon">&#10003;</span> Plan approved and executing. Updates will be applied within the hour.</span></p>`;
}

function clearScenario() {
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('selected'));
  const area = document.getElementById('decisionArea');
  area.innerHTML = `<p>Which approach should we take? Select a scenario above.</p>`;
  document.getElementById('executionPlan').classList.remove('visible');
}

/* ============================================================
   TAB D: COMPLIANCE
   ============================================================ */
function buildComplianceTab(personId, p, reports, dependents, depBenefitsList, jurisdictions, equity, salary, benefits, complianceItems) {
  const el = document.getElementById('tab-compliance');
  const hasCobra = depBenefitsList.some(d => d.benefits.some(b => b.properties.type === 'medical'));
  const depNames = depBenefitsList.map(d => d.dep ? d.dep.properties.name : 'Unknown');
  const medicalBenefits = depBenefitsList.flatMap(d => d.benefits.filter(b => b.properties.type === 'medical'));
  const medicalPlan = medicalBenefits.length > 0 ? medicalBenefits[0] : null;
  const depRelationship = depBenefitsList.length > 0 && depBenefitsList[0].dep ? depBenefitsList[0].dep.properties.relationship : 'dependent';

  const jurisdictionNames = jurisdictions.map(j => { const n = getNode(j); return n ? n.properties.name : ''; }).filter(Boolean);
  const hasTexas = jurisdictionNames.includes('Texas');

  const autoHandled = 2 + (hasCobra ? 0 : 0);
  const needsSignoff = (hasCobra ? 1 : 0) + 1 + (equity ? 1 : 0); // COBRA + paycheck confirm + equity
  const totalCompliance = needsSignoff + autoHandled + (equity ? 0 : 0) + 1; // + w2

  let timelineHtml = '';

  // 1. Final Paycheck (urgent)
  if (hasTexas) {
    timelineHtml += `
      <div class="timeline-item">
        <div class="timeline-dot urgent"></div>
        <div class="timeline-date">
          <span class="date-text">February 12, 2026</span>
          <span class="timeline-countdown red">6 days remaining</span>
        </div>
        <div class="timeline-title">Final Paycheck</div>
        <div class="timeline-agent-text">TX Labor Code 61.014 requires payment within 6 days of involuntary separation. <span class="done-text">I've flagged payroll to include ${p.name} in the February 12 run</span> with prorated salary, accrued PTO payout, and any pending expense reimbursements.</div>
        <div class="timeline-legal-ref">Reference: Texas Labor Code 61.014</div>
        <div class="action-buttons">
          <button class="action-btn approve" onclick="handleApprove(this)">Confirm</button>
        </div>
      </div>
    `;
  }

  // 2. COBRA Notice
  if (hasCobra) {
    const monthlyPremium = medicalPlan ? ((medicalPlan.properties.monthlyPremiumEmployee || 0) + (medicalPlan.properties.monthlyPremiumEmployer || 0)) : 900;
    const cobraPremium = (monthlyPremium * 1.02).toFixed(2);
    timelineHtml += `
      <div class="timeline-item">
        <div class="timeline-dot urgent"></div>
        <div class="timeline-date">
          <span class="date-text">February 20, 2026</span>
          <span class="timeline-countdown red">14 days remaining</span>
        </div>
        <div class="timeline-title">COBRA Notice for ${depNames[0] || 'Dependent'}</div>
        <div class="timeline-agent-text">29 USC 1166 requires 14-day employer notice for qualifying events. <span class="pending-text">I've drafted the notice for ${depNames[0]} (${depRelationship}, family medical through ${medicalPlan ? medicalPlan.properties.name : 'Medical Plan'}).</span> Monthly COBRA premium: $${cobraPremium} (102% of plan cost). Election period: 60 days.</div>
        <div class="timeline-legal-ref">Reference: 29 USC 1166, COBRA Continuation Coverage</div>
        <div class="action-buttons">
          <button class="action-btn edit">Review Draft</button>
          <button class="action-btn approve" onclick="handleApprove(this)">Approve & Send</button>
        </div>
      </div>
    `;
  }

  // 3. Benefits Termination
  timelineHtml += `
    <div class="timeline-item">
      <div class="timeline-dot pending"></div>
      <div class="timeline-date">
        <span class="date-text">February 28, 2026</span>
        <span class="timeline-countdown yellow">22 days remaining</span>
      </div>
      <div class="timeline-title">Benefits Coverage Ends</div>
      <div class="timeline-agent-text"><span class="done-text">Scheduled termination of ${benefits.length} benefit enrollments</span> (medical, dental, vision, life insurance) at end of month per plan terms. ${depBenefitsList.length > 0 ? `Dependent coverage for ${depNames.join(', ')} also terminates -- COBRA election covers the gap.` : ''}</div>
      <div class="timeline-legal-ref">Reference: Plan SPD terms, ERISA 601-608</div>
    </div>
  `;

  // 4. Equity Exercise Window
  if (equity) {
    const unvested = (equity.properties.totalShares || 0) - (equity.properties.vestedShares || 0);
    timelineHtml += `
      <div class="timeline-item">
        <div class="timeline-dot pending"></div>
        <div class="timeline-date">
          <span class="date-text">May 7, 2026</span>
          <span class="timeline-countdown yellow">90-day window</span>
        </div>
        <div class="timeline-title">Equity Exercise Window Closes</div>
        <div class="timeline-agent-text">${p.name} has ${(equity.properties.vestedShares || 0).toLocaleString()} vested shares eligible for exercise. <span class="pending-text">${unvested.toLocaleString()} unvested shares (${formatMoney(Math.round((equity.properties.amount / equity.properties.totalShares) * unvested))}) return to the company pool.</span> 90-day post-termination exercise window per grant agreement.</div>
        <div class="timeline-legal-ref">Reference: Equity Grant Agreement, IRC 422 (ISO rules)</div>
        <div class="action-buttons">
          <button class="action-btn approve" onclick="handleApprove(this)">Notify ${p.name.split(' ')[0]}</button>
          <button class="action-btn edit">Review Terms</button>
        </div>
      </div>
    `;
  }

  // 5. W-2
  timelineHtml += `
    <div class="timeline-item">
      <div class="timeline-dot future"></div>
      <div class="timeline-date">
        <span class="date-text">January 31, 2027</span>
        <span class="timeline-countdown gray">Year-end</span>
      </div>
      <div class="timeline-title">W-2 Preparation</div>
      <div class="timeline-agent-text"><span class="done-text">Queued for year-end processing.</span> Will include all compensation through separation date, PTO payout, and any equity exercise income.</div>
      <div class="timeline-legal-ref">Reference: IRS Publication 15, 26 USC 6051</div>
    </div>
  `;

  // 6. Equipment Return
  timelineHtml += `
    <div class="timeline-item">
      <div class="timeline-dot handled"></div>
      <div class="timeline-date">
        <span class="date-text">February 6, 2026</span>
        <span class="timeline-countdown green">Auto-handled</span>
      </div>
      <div class="timeline-title">Equipment Return</div>
      <div class="timeline-agent-text"><span class="done-text">Return request sent to IT for assigned devices.</span> Shipping label auto-generated. Tracking will be monitored and escalated if not received within 14 days.</div>
    </div>
  `;

  // 7. Access Revocation
  timelineHtml += `
    <div class="timeline-item">
      <div class="timeline-dot handled"></div>
      <div class="timeline-date">
        <span class="date-text">February 6, 2026</span>
        <span class="timeline-countdown green">Auto-handled</span>
      </div>
      <div class="timeline-title">Access Revocation</div>
      <div class="timeline-agent-text"><span class="done-text">Scheduled deactivation of all accounts</span> (email, Slack, GitHub, AWS, VPN) at 5:00 PM on last day. Manager email archive retained for 30 days per policy.</div>
    </div>
  `;

  const autoCount = 3; // equipment, access, w2
  const signoffCount = (hasCobra ? 2 : 1) + (equity ? 1 : 0);
  const totalItems = 5 + (hasCobra ? 1 : 0) + (equity ? 1 : 0);

  el.innerHTML = `
    <div class="compliance-header animate-in">
      <div class="shield-icon">&#x1f6e1;</div>
      <div class="compliance-summary">
        <strong>${totalItems} compliance requirements identified.</strong> ${autoCount} auto-handled, ${signoffCount} need your sign-off.
        ${jurisdictionNames.length > 0 ? `<br>Jurisdictions: ${jurisdictionNames.join(', ')}` : ''}
      </div>
    </div>

    <div class="timeline animate-in" style="animation-delay: 0.1s;">
      ${timelineHtml}
    </div>

    <div class="graph-advantage animate-in" style="animation-delay: 0.2s;">
      <div class="graph-advantage-header">
        <div class="graph-advantage-icon">G</div>
        <div class="graph-advantage-label">Why this requires the employee graph</div>
      </div>
      <p>I identified these compliance requirements by tracing ${p.name}'s connections to jurisdictions (${jurisdictionNames.join(', ')}), benefits plans (${benefits.map(b => { const n = getNode(b.id); return n ? n.properties.type : ''; }).filter(Boolean).filter((v,i,a) => a.indexOf(v) === i).join(', ')}), dependents (${depNames.join(', ') || 'none'}), compensation records (equity grant with vesting schedule), and employment documents. A traditional HRIS offboarding checklist is generic -- it can't adapt to each person's specific situation. The graph builds a custom compliance plan for every departure by walking their actual relationships.</p>
    </div>
  `;

  // Wire up approve buttons
  el.querySelectorAll('.action-btn.approve').forEach(btn => {
    btn.addEventListener('click', function() {
      const card = this.closest('.timeline-item');
      const buttonsDiv = card.querySelector('.action-buttons');
      if (buttonsDiv) {
        buttonsDiv.innerHTML = `<span class="approve-check"><span class="check-icon">&#10003;</span> Confirmed</span>`;
      }
      const dot = card.querySelector('.timeline-dot');
      if (dot) { dot.className = 'timeline-dot handled'; }
      const countdown = card.querySelector('.timeline-countdown');
      if (countdown) { countdown.className = 'timeline-countdown green'; countdown.textContent = 'Done'; }
    });
  });
}

/* ============================================================
   TAB E: IMPACT STORY
   ============================================================ */
function buildStoryTab(personId, p, reports, managerName, managerId, dependents, depBenefitsList, candidateNodes, offerCandidates, unvestedShares, unvestedValue, equity, salary, tenure, total, projects, teams, actionCount, complianceItems) {
  const el = document.getElementById('tab-story');
  const pctHeadcount = total > 0 ? ((reports.length / total) * 100).toFixed(1) : '?';
  const salaryAmt = salary ? salary.properties.amount : 0;
  const equityAmt = equity ? equity.properties.amount : 0;
  const totalComp = salaryAmt + equityAmt;
  const depNames = depBenefitsList.map(d => d.dep ? d.dep.properties.name : 'Unknown');
  const hasCobra = depBenefitsList.some(d => d.benefits.some(b => b.properties.type === 'medical'));

  const ic3Reports = reports.filter(r => prop(r, 'level') === 'IC-3');

  // Build report names for org snippet
  const reportSnippet = reports.slice(0, 5).map(r => {
    const name = prop(r, 'name') || 'Unknown';
    const role = prop(r, 'role') || '';
    return `<div class="org-snippet-node report-node"><span class="snippet-name">${name}</span><span class="snippet-info">${role}</span></div>`;
  }).join('');
  const moreReports = reports.length > 5 ? `<div class="org-snippet-node report-node" style="color:var(--text-muted);font-style:italic;">+ ${reports.length - 5} more</div>` : '';

  // Compliance deadlines
  const complianceCards = [];
  if (hasCobra) complianceCards.push({ title: 'COBRA Notice', date: 'Feb 20', days: '14 days', color: 'red' });
  complianceCards.push({ title: 'Final Paycheck (TX)', date: 'Feb 12', days: '6 days', color: 'red' });
  if (equity) complianceCards.push({ title: 'Equity Exercise Window', date: 'May 7', days: '90 days', color: 'yellow' });

  el.innerHTML = `
    <div class="report-header animate-in">
      <h2>Impact Assessment: ${p.name} Departure</h2>
      <div class="report-meta">Prepared by HR System &middot; February 6, 2026 &middot; Confidential</div>
    </div>

    <div class="story-block animate-in" style="animation-delay: 0.1s;">
      <p>
        <span class="emphasis">${p.name}</span> has been with Acme Co for <span class="emphasis">${tenure} years</span>, leading <span class="emphasis">${reports.length} engineers</span> -- <span class="emphasis">${pctHeadcount}%</span> of total headcount and one of the largest reporting chains in the company. This departure creates immediate compliance obligations (${hasCobra ? `COBRA for ${dependents.length} dependent, ` : ''}TX final paycheck deadline), a structural gap (${reports.length} reports need reassignment across ${projects.length} active projects), and a <span class="emphasis">${formatMoney(totalComp)}</span> total comp position to backfill.
        ${candidateNodes.length > 0 ? `<span class="good-news">The good news: we have ${candidateNodes.length} candidates already in pipeline${offerCandidates.length > 0 ? `, and ${offerCandidates[0].node.properties.name} is at offer stage` : ''}${ic3Reports.length > 0 ? `, and ${prop(ic3Reports[0], 'name')} is a strong internal promotion candidate` : ''}.</span>` : ''}
      </p>
    </div>

    <div class="impact-grid animate-in" style="animation-delay: 0.15s;">
      <div class="impact-cell">
        <div class="impact-cell-header">
          <div class="impact-cell-icon" style="background: var(--accent-purple-dim); color: var(--accent-purple);">&#9679;</div>
          <div class="impact-cell-title">People</div>
        </div>
        <div class="org-snippet">
          <div class="org-snippet-node mgr"><span class="snippet-name">${managerName}</span><span class="snippet-info">Manager</span></div>
          <div class="org-snippet-node gap"><span class="snippet-name">${p.name}</span><span class="snippet-info">DEPARTING</span></div>
          ${reportSnippet}
          ${moreReports}
        </div>
        <div style="margin-top: 12px; font-size: 15px; color: var(--text-muted);">
          ${reports.length} reports, ${teams.length} teams affected
        </div>
      </div>

      <div class="impact-cell">
        <div class="impact-cell-header">
          <div class="impact-cell-icon" style="background: var(--accent-green-dim); color: var(--accent-green);">$</div>
          <div class="impact-cell-title">Financial</div>
        </div>
        <div class="stat-row">
          <span class="stat-label">Base Salary</span>
          <span class="stat-value">${formatMoney(salaryAmt)}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Equity Grant</span>
          <span class="stat-value">${formatMoney(equityAmt)}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Total Comp</span>
          <span class="stat-value" style="color: var(--accent-green);">${formatMoney(totalComp)}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Unvested Equity Returned</span>
          <span class="stat-value">${unvestedShares.toLocaleString()} shares (${formatMoney(unvestedValue)})</span>
        </div>
        <div style="margin-top: 8px; font-size: 13px; color: var(--text-muted);">
          Position salary band: ${salary ? formatMoney(salary.properties.amount * 0.8) + ' - ' + formatMoney(salary.properties.amount * 1.05) : 'N/A'}
        </div>
      </div>

      <div class="impact-cell">
        <div class="impact-cell-header">
          <div class="impact-cell-icon" style="background: var(--accent-red-dim); color: var(--accent-red);">!</div>
          <div class="impact-cell-title">Compliance</div>
        </div>
        ${complianceCards.map(c => `
          <div class="countdown-card">
            <div class="cd-title">${c.title}</div>
            <div class="cd-date">${c.date}, 2026</div>
            <div class="cd-days" style="color: var(--accent-${c.color});">${c.days} remaining</div>
          </div>
        `).join('')}
      </div>

      <div class="impact-cell">
        <div class="impact-cell-header">
          <div class="impact-cell-icon" style="background: var(--accent-blue-dim); color: var(--accent-blue);">&#8599;</div>
          <div class="impact-cell-title">Pipeline</div>
        </div>
        ${candidateNodes.length > 0 ? candidateNodes.slice(0, 4).map(c => {
    const cn = c.node.properties;
    const stage = c.meta.stage || cn.status || 'unknown';
    const stageClass = stage === 'offer' ? 'offer' : 'interview';
    return `
          <div class="candidate-card">
            <div>
              <div class="c-name">${cn.name}</div>
              <div class="c-role">${cn.appliedRole || 'Engineer'}</div>
            </div>
            <div class="c-stage ${stageClass}">${stage}</div>
          </div>`;
  }).join('') : '<div style="font-size: 15px; color: var(--text-muted);">No candidates in pipeline</div>'}
        ${ic3Reports.length > 0 ? `<div style="margin-top: 8px; font-size: 13px; color: var(--accent-purple);">Internal: ${prop(ic3Reports[0], 'name')} (promotion candidate)</div>` : ''}
      </div>
    </div>

    <div class="recommended-actions animate-in" style="animation-delay: 0.2s;">
      <h3>Recommended Actions</h3>
      <div class="rec-action">
        <div class="rec-num">1</div>
        <div>Approve interim reporting to <strong>${managerName}</strong> (current skip-level, already oversees this area) within 24 hours</div>
      </div>
      ${offerCandidates.length > 0 ? `
      <div class="rec-action">
        <div class="rec-num">2</div>
        <div>Fast-track <strong>${offerCandidates[0].node.properties.name}</strong>'s offer -- they're the strongest pipeline match at ${formatMoney(offerCandidates[0].node.properties.expectedComp || 0)} expected comp</div>
      </div>
      ` : `
      <div class="rec-action">
        <div class="rec-num">2</div>
        <div>Post backfill position immediately -- draft job posting is ready for review</div>
      </div>
      `}
      <div class="rec-action">
        <div class="rec-num">3</div>
        <div>Schedule all-hands for ${p.name}'s team within 48 hours to address the transition and answer questions</div>
      </div>
      <div class="rec-action">
        <div class="rec-num">4</div>
        <div>Begin knowledge transfer on <strong>API Refactor</strong> project immediately -- it's high priority with a May 2026 deadline</div>
      </div>
      <div class="rec-action">
        <div class="rec-num">5</div>
        <div>Process COBRA notice for ${depBenefitsList.length > 0 && depBenefitsList[0].dep ? depBenefitsList[0].dep.properties.name : 'dependents'} within 14 days (federal requirement)</div>
      </div>
    </div>

    <div class="share-buttons animate-in" style="animation-delay: 0.25s;">
      <button class="share-btn" onclick="copyLink()">&#128279; Copy Link</button>
      <button class="share-btn" onclick="downloadPdf()">&#128196; Download PDF</button>
      <button class="share-btn" onclick="emailReport()">&#9993; Email to Leadership</button>
    </div>

    <div class="graph-advantage animate-in" style="animation-delay: 0.3s;">
      <div class="graph-advantage-header">
        <div class="graph-advantage-icon">G</div>
        <div class="graph-advantage-label">Why this requires the employee graph</div>
      </div>
      <p>This impact assessment was generated automatically by analyzing ${p.name}'s 60+ organizational connections across people, compensation, benefits, compliance, and pipeline data. A traditional HRIS would require an HR business partner to manually compile this from 6+ different system modules -- typically taking 2-4 hours. The graph produced it in seconds because every relationship is already connected: person to team to project, person to dependent to benefits plan to jurisdiction, position to candidate to interview scores.</p>
    </div>
  `;
}

function copyLink() {
  const btn = event.target;
  btn.innerHTML = '&#10003; Copied!';
  setTimeout(() => btn.innerHTML = '&#128279; Copy Link', 2000);
}
function downloadPdf() {
  const btn = event.target;
  btn.innerHTML = '&#10003; Generating...';
  setTimeout(() => btn.innerHTML = '&#128196; Download PDF', 2000);
}
function emailReport() {
  const btn = event.target;
  btn.innerHTML = '&#10003; Sent!';
  setTimeout(() => btn.innerHTML = '&#9993; Email to Leadership', 2000);
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
  if (btn) btn.classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  try {
    await loadData();
    populatePersonPicker();
    buildAllTabs('person-008');
    document.getElementById('loadingState').style.display = 'none';
  } catch (err) {
    console.error('Failed to load data:', err);
    document.getElementById('loadingState').innerHTML = `
      <div style="color: var(--accent-red); text-align: center;">
        <p style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">Failed to load data</p>
        <p style="font-size: 15px; color: var(--text-muted);">Make sure you're serving from the project root.<br>Try: python3 -m http.server 8765</p>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 8px;">${err.message}</p>
      </div>
    `;
  }
}

init();
</script>

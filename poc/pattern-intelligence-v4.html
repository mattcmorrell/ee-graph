/* ================================================================
   DATA LOADING & GRAPH HELPERS
   ================================================================ */
let G = { nodes: [], edges: [], byId: {}, byType: {} };

async function loadData() {
  try {
    const [nodesResp, edgesResp] = await Promise.all([
      fetch('../data/nodes.json'), fetch('../data/edges.json')
    ]);
    const nodesData = await nodesResp.json();
    const edgesData = await edgesResp.json();
    G.nodes = nodesData.nodes;
    G.edges = edgesData.edges;
    G.nodes.forEach(function(n) {
      G.byId[n.id] = n;
      if (!G.byType[n.type]) G.byType[n.type] = [];
      G.byType[n.type].push(n);
    });
    document.getElementById('loadingState').style.display = 'none';
    renderAll();
  } catch (e) {
    document.getElementById('loadingState').innerHTML =
      '<div style="color:var(--accent-red);">Failed to load data. Serve from project root: python3 -m http.server 8765</div>';
    console.error(e);
  }
}

function nd(id) { return G.byId[id] || null; }
function nbt(type) { return G.byType[type] || []; }
function p(n, key) { return n && n.properties ? n.properties[key] : undefined; }
function ef(nodeId, type) { return G.edges.filter(function(e) { return e.source === nodeId && (!type || e.type === type); }); }
function et(nodeId, type) { return G.edges.filter(function(e) { return e.target === nodeId && (!type || e.type === type); }); }
function eot(type) { return G.edges.filter(function(e) { return e.type === type; }); }
function getDept(pid) { var e = ef(pid, 'in_department')[0]; return e ? nd(e.target) : null; }
function getManager(pid) { var e = ef(pid, 'reports_to')[0]; return e ? nd(e.target) : null; }
function getReports(pid) { return et(pid, 'reports_to').map(function(e) { return nd(e.source); }).filter(Boolean); }
function getTeams(pid) { return ef(pid, 'member_of').map(function(e) { return nd(e.target); }).filter(Boolean); }
function getComps(pid) { return ef(pid, 'has_comp').map(function(e) { return nd(e.target); }).filter(Boolean); }
function getReviews(pid) { return ef(pid, 'has_review').map(function(e) { return nd(e.target); }).filter(Boolean); }
function getPosition(pid) { var e = ef(pid, 'holds_position')[0]; return e ? nd(e.target) : null; }
function getSurveys(pid) { return ef(pid, 'responded_to').map(function(e) { return nd(e.target); }).filter(Boolean); }
function daysBetween(d1, d2) { return Math.round((new Date(d2) - new Date(d1)) / (1000*60*60*24)); }
function initials(name) { return name ? name.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2) : '?'; }
function fmtMoney(n) { return '$' + Number(n).toLocaleString(); }
var COLORS = ['#4ea8de','#b388ff','#06d6a0','#ffd166','#ff4d6a','#64dfdf','#ff8c42','#f472b6'];
function colorFor(i) { return COLORS[i % COLORS.length]; }
var NOW = '2026-02-06';

/* ================================================================
   TAB SWITCHING
   ================================================================ */
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');

    if (target) target.classList.add('active');
  });
});

function setupSubTabs(containerId) {
  var container = document.getElementById(containerId);
  if (!container) return;
  container.querySelectorAll('.sub-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      container.querySelectorAll('.sub-tab').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      container.querySelectorAll('.sub-panel').forEach(function(p) { p.classList.remove('active'); });
      var target = container.querySelector('#' + btn.dataset.sub);
      if (target) target.classList.add('active');
    });
  });
}

/* ================================================================
   TAB 1: ORG HEALTH PULSE
   ================================================================ */
function renderOrgHealth() {
  var people = nbt('person');
  var active = people.filter(function(x) { return p(x,'status') === 'active'; });
  var terminated = people.filter(function(x) { return p(x,'status') === 'terminated'; });
  var departments = nbt('department');
  var surveys = nbt('survey_response');
  var enpsSurveys = surveys.filter(function(s) { return p(s,'surveyType') === 'enps'; });
  var wellbeingSurveys = surveys.filter(function(s) { return p(s,'surveyType') === 'wellbeing'; });
  var recognitionEdges = eot('recognized');
  var reviewEdges = eot('has_review');
  var peopleWithReviews = {};
  reviewEdges.forEach(function(e) { peopleWithReviews[e.source] = true; });
  var reviewCoverage = Math.round((Object.keys(peopleWithReviews).length / active.length) * 100);
  var retentionRate = ((active.length / (active.length + terminated.length)) * 100).toFixed(1);

  // eNPS
  var promoters = enpsSurveys.filter(function(s) { return p(s,'sentiment') === 'promoter'; }).length;
  var detractors = enpsSurveys.filter(function(s) { return p(s,'sentiment') === 'detractor'; }).length;
  var enps = enpsSurveys.length > 0 ? Math.round(((promoters - detractors) / enpsSurveys.length) * 100) : 0;

  // Wellbeing avg
  var wbAvg = wellbeingSurveys.length > 0 ? (wellbeingSurveys.reduce(function(s,w) { return s + (p(w,'score') || 0); }, 0) / wellbeingSurveys.length).toFixed(1) : 'N/A';

  // Dept stats
  var deptStats = {};
  departments.forEach(function(d) {
    deptStats[d.id] = { name: p(d,'name'), active: 0, terminated: 0, totalTenure: 0, recognitions: 0, reviewDone: 0 };
  });
  active.forEach(function(person) {
    var dept = getDept(person.id);
    if (dept && deptStats[dept.id]) {
      deptStats[dept.id].active++;
      var start = p(person, 'startDate');
      if (start) deptStats[dept.id].totalTenure += daysBetween(start, NOW) / 365;
      if (peopleWithReviews[person.id]) deptStats[dept.id].reviewDone++;
    }
  });
  terminated.forEach(function(person) {
    var dept = getDept(person.id);
    if (dept && deptStats[dept.id]) deptStats[dept.id].terminated++;
  });
  recognitionEdges.forEach(function(e) {
    var person = nd(e.target);
    if (!person) return;
    var dept = getDept(person.id);
    if (dept && deptStats[dept.id]) deptStats[dept.id].recognitions++;
  });

  var deptArr = Object.values(deptStats).filter(function(d) { return d.active > 0; }).sort(function(a,b) { return b.active - a.active; });

  // Heatmap
  var metrics = ['Headcount', 'Turnover', 'Avg Tenure', 'Review %', 'Recognition'];
  var heatmapRows = deptArr.map(function(d) {
    var turnover = d.active + d.terminated > 0 ? ((d.terminated / (d.active + d.terminated)) * 100).toFixed(0) : '0';
    var avgTenure = d.active > 0 ? (d.totalTenure / d.active).toFixed(1) : '0';
    var reviewPct = d.active > 0 ? Math.round((d.reviewDone / d.active) * 100) : 0;
    return { name: d.name, headcount: d.active, turnover: parseFloat(turnover), avgTenure: parseFloat(avgTenure), reviewPct: reviewPct, recognitions: d.recognitions };
  });

  function heatColor(val, metric) {
    if (metric === 'turnover') return val > 15 ? 'var(--accent-red)' : val > 8 ? 'var(--accent-yellow)' : 'var(--accent-green)';
    if (metric === 'avgTenure') return val > 3 ? 'var(--accent-green)' : val > 1.5 ? 'var(--accent-yellow)' : 'var(--accent-orange)';
    if (metric === 'reviewPct') return val > 80 ? 'var(--accent-green)' : val > 50 ? 'var(--accent-yellow)' : 'var(--accent-red)';
    if (metric === 'recognitions') return val > 5 ? 'var(--accent-green)' : val > 2 ? 'var(--accent-yellow)' : 'var(--accent-orange)';
    return 'var(--accent-blue)';
  }
  function heatBg(val, metric) {
    if (metric === 'turnover') return val > 15 ? 'var(--accent-red-dim)' : val > 8 ? 'var(--accent-yellow-dim)' : 'var(--accent-green-dim)';
    if (metric === 'avgTenure') return val > 3 ? 'var(--accent-green-dim)' : val > 1.5 ? 'var(--accent-yellow-dim)' : 'var(--accent-orange-dim)';
    if (metric === 'reviewPct') return val > 80 ? 'var(--accent-green-dim)' : val > 50 ? 'var(--accent-yellow-dim)' : 'var(--accent-red-dim)';
    if (metric === 'recognitions') return val > 5 ? 'var(--accent-green-dim)' : val > 2 ? 'var(--accent-yellow-dim)' : 'var(--accent-orange-dim)';
    return 'var(--accent-blue-dim)';
  }

  var cols = 1 + metrics.length;
  var hmHtml = '<div class="heatmap" style="grid-template-columns: 140px repeat(' + metrics.length + ', 1fr);">';
  hmHtml += '<div class="heatmap-label"></div>';
  metrics.forEach(function(m) { hmHtml += '<div class="heatmap-label">' + m + '</div>'; });
  heatmapRows.forEach(function(row) {
    hmHtml += '<div class="heatmap-row-label">' + row.name + '</div>';
    hmHtml += '<div class="heatmap-cell" style="background:var(--accent-blue-dim);color:var(--accent-blue);">' + row.headcount + '</div>';
    hmHtml += '<div class="heatmap-cell" style="background:' + heatBg(row.turnover,'turnover') + ';color:' + heatColor(row.turnover,'turnover') + ';">' + row.turnover + '%</div>';
    hmHtml += '<div class="heatmap-cell" style="background:' + heatBg(row.avgTenure,'avgTenure') + ';color:' + heatColor(row.avgTenure,'avgTenure') + ';">' + row.avgTenure + 'y</div>';
    hmHtml += '<div class="heatmap-cell" style="background:' + heatBg(row.reviewPct,'reviewPct') + ';color:' + heatColor(row.reviewPct,'reviewPct') + ';">' + row.reviewPct + '%</div>';
    hmHtml += '<div class="heatmap-cell" style="background:' + heatBg(row.recognitions,'recognitions') + ';color:' + heatColor(row.recognitions,'recognitions') + ';">' + row.recognitions + '</div>';
  });
  hmHtml += '</div>';

  // Tenure distribution bars
  var tenureBuckets = {'<1yr': 0, '1-2yr': 0, '2-3yr': 0, '3-5yr': 0, '5+yr': 0};
  active.forEach(function(person) {
    var start = p(person, 'startDate');
    if (!start) return;
    var yrs = daysBetween(start, NOW) / 365;
    if (yrs < 1) tenureBuckets['<1yr']++;
    else if (yrs < 2) tenureBuckets['1-2yr']++;
    else if (yrs < 3) tenureBuckets['2-3yr']++;
    else if (yrs < 5) tenureBuckets['3-5yr']++;
    else tenureBuckets['5+yr']++;
  });
  var maxBucket = Math.max.apply(null, Object.values(tenureBuckets));
  var tenureHtml = '';
  var bucketColors = ['var(--accent-blue)', 'var(--accent-cyan)', 'var(--accent-green)', 'var(--accent-yellow)', 'var(--accent-orange)'];
  var bi = 0;
  Object.keys(tenureBuckets).forEach(function(label) {
    var count = tenureBuckets[label];
    var pct = maxBucket > 0 ? Math.round((count / maxBucket) * 100) : 0;
    tenureHtml += '<div class="hbar-row"><div class="hbar-label">' + label + '</div>' +
      '<div class="hbar-track"><div class="hbar-fill" style="width:' + pct + '%;background:' + bucketColors[bi] + ';">' + count + '</div></div></div>';
    bi++;
  });

  // Watch list - find departments with concerning aggregate patterns
  var watchItems = [];
  deptArr.forEach(function(d) {
    if (d.turnover > 10) {
      watchItems.push({ color: 'var(--accent-red)', text: '<strong>' + d.name + '</strong> has ' + d.terminated + ' departures (' + ((d.terminated / (d.active + d.terminated)) * 100).toFixed(0) + '% turnover) in the analysis window.', badge: 'High Turnover', badgeBg: 'var(--accent-red-dim)', badgeColor: 'var(--accent-red)' });
    }
    if (d.active > 0 && d.reviewDone / d.active < 0.6) {
      watchItems.push({ color: 'var(--accent-yellow)', text: '<strong>' + d.name + '</strong> has ' + (d.active - d.reviewDone) + ' people without completed reviews (' + Math.round((d.reviewDone / d.active) * 100) + '% coverage).', badge: 'Review Gap', badgeBg: 'var(--accent-yellow-dim)', badgeColor: 'var(--accent-yellow)' });
    }
  });

  // People with attention signals (aggregate)
  var recognizedPeople = {};
  recognitionEdges.forEach(function(e) { recognizedPeople[e.target] = true; });
  var compEdges = eot('has_comp');
  var latestCompByPerson = {};
  compEdges.forEach(function(e) {
    var comp = nd(e.target);
    if (!comp || p(comp,'type') !== 'salary') return;
    var dt = p(comp, 'effectiveDate');
    if (!latestCompByPerson[e.source] || dt > latestCompByPerson[e.source]) latestCompByPerson[e.source] = dt;
  });

  var flaggedByDept = {};
  active.forEach(function(person) {
    var hasRec = recognizedPeople[person.id];
    var lastComp = latestCompByPerson[person.id] || '2020-01-01';
    var daysSinceComp = daysBetween(lastComp, NOW);
    var hasReview = peopleWithReviews[person.id];
    var score = (daysSinceComp > 365 ? 1 : 0) + (!hasRec ? 1 : 0) + (!hasReview ? 1 : 0);
    if (score >= 3) {
      var dept = getDept(person.id);
      var dName = dept ? p(dept, 'name') : 'Other';
      if (!flaggedByDept[dName]) flaggedByDept[dName] = 0;
      flaggedByDept[dName]++;
    }
  });
  Object.keys(flaggedByDept).forEach(function(dName) {
    watchItems.push({ color: 'var(--accent-orange)', text: '<strong>' + dName + '</strong> has ' + flaggedByDept[dName] + ' people matching concerning signal patterns (no recognition, stale comp, missing review).', badge: 'Attention Signals', badgeBg: 'var(--accent-orange-dim)', badgeColor: 'var(--accent-orange)' });
  });

  var watchHtml = watchItems.length > 0 ? watchItems.map(function(w) {
    return '<div class="watch-item"><div class="watch-dot" style="background:' + w.color + ';"></div><div class="watch-text">' + w.text + '</div><div class="watch-badge" style="background:' + w.badgeBg + ';color:' + w.badgeColor + ';">' + w.badge + '</div></div>';
  }).join('') : '<div style="font-size:15px;color:var(--accent-green);padding:12px;">No critical watch items. All departments are within healthy thresholds.</div>';

  var el = document.getElementById('tab-orghealth');
  el.innerHTML =
    '<div class="agent-narrative anim">' +
      '<div class="agent-narrative-header"><div class="agent-avatar">A</div><div class="agent-label">Org Health Pulse</div></div>' +
      '<div class="agent-summary">Acme has <span class="hl">' + active.length + ' active employees</span> across ' + deptArr.length + ' departments with a <span class="gd">' + retentionRate + '% retention rate</span>. ' +
      'eNPS is <span class="' + (enps > 0 ? 'gd' : 'ur') + '">' + (enps > 0 ? '+' : '') + enps + '</span> based on ' + enpsSurveys.length + ' responses. ' +
      'Review coverage stands at ' + reviewCoverage + '%. ' +
      (watchItems.length > 0 ? '<span class="ur">' + watchItems.length + ' items need attention</span> across departments.' : 'All health metrics are within normal ranges.') +
      '</div></div>' +

    '<div class="kpi-row anim" style="animation-delay:0.05s;">' +
      '<div class="kpi-card"><div class="kpi-label">Active Employees</div><div class="kpi-value" style="color:var(--accent-blue);">' + active.length + '</div><div class="kpi-sub">' + terminated.length + ' departed</div></div>' +
      '<div class="kpi-card"><div class="kpi-label">Retention Rate</div><div class="kpi-value" style="color:var(--accent-green);">' + retentionRate + '%</div><div class="kpi-sub">trailing period</div></div>' +
      '<div class="kpi-card"><div class="kpi-label">eNPS</div><div class="kpi-value" style="color:' + (enps > 0 ? 'var(--accent-green)' : 'var(--accent-red)') + ';">' + (enps > 0 ? '+' : '') + enps + '</div><div class="kpi-sub">' + enpsSurveys.length + ' responses</div></div>' +
      '<div class="kpi-card"><div class="kpi-label">Wellbeing Avg</div><div class="kpi-value" style="color:var(--accent-cyan);">' + wbAvg + '</div><div class="kpi-sub">out of 5.0</div></div>' +
      '<div class="kpi-card"><div class="kpi-label">Review Coverage</div><div class="kpi-value" style="color:' + (reviewCoverage > 70 ? 'var(--accent-green)' : 'var(--accent-yellow)') + ';">' + reviewCoverage + '%</div><div class="kpi-sub">' + Object.keys(peopleWithReviews).length + ' of ' + active.length + '</div></div>' +
    '</div>' +

    '<div class="section-header anim" style="animation-delay:0.1s;">Department Health Heatmap</div>' +
    '<div class="section-sub">Cross-department comparison across key metrics. Green = healthy, yellow = watch, red = action needed.</div>' +
    '<div class="anim" style="animation-delay:0.12s;">' + hmHtml + '</div>' +

    '<div class="grid-2 anim" style="animation-delay:0.15s;">' +
      '<div class="card"><div class="card-title">Tenure Distribution</div>' + tenureHtml + '</div>' +
      '<div class="card"><div class="card-title">Watch List</div>' + watchHtml + '</div>' +
    '</div>' +

    '<div class="graph-advantage anim" style="animation-delay:0.2s;">' +
      '<div class="graph-advantage-header"><div class="graph-advantage-icon">G</div><div class="graph-advantage-label">Why this requires the employee graph</div></div>' +
      '<p>This health pulse synthesizes data across 7 graph domains simultaneously: people, departments, compensation, reviews, recognition, surveys, and reporting chains. The heatmap cross-references turnover patterns with recognition distribution and review coverage to surface department-level risks that no single HRIS module can detect. Traditional systems require pulling 5+ separate reports and manually correlating the data. The graph produces this analysis by walking connected relationships in real time.</p>' +
    '</div>';
}

/* ================================================================
   TAB 2: HIRING CO-PILOT (3 sub-tabs)
   ================================================================ */
function renderHiring() {
  var candidates = nbt('candidate');
  var activeCands = candidates.filter(function(c) { return !['rejected','withdrawn'].includes(p(c,'status')); });
  var people = nbt('person').filter(function(x) { return p(x,'status') === 'active'; });

  // Position band info
  var srEngPos = nbt('position').find(function(pos) { return p(pos,'title') === 'Senior Engineer' && p(pos,'level') === 'IC-4'; });
  var bandMin = srEngPos ? p(srEngPos,'salaryBandMin') : 150000;
  var bandMax = srEngPos ? p(srEngPos,'salaryBandMax') : 195000;
  var bandMid = Math.round((bandMin + bandMax) / 2);

  // Candidate pipeline stages
  var stageCounts = { applied: 0, screening: 0, phone_screen: 0, interviewing: 0, onsite: 0, offer: 0, accepted: 0 };
  var stageOrder = ['applied','screening','phone_screen','interviewing','onsite','offer','accepted'];
  candidates.forEach(function(c) {
    var st = p(c, 'status');
    if (stageCounts[st] !== undefined) stageCounts[st]++;
  });

  // Source breakdown
  var sourceCount = {};
  candidates.forEach(function(c) {
    var src = p(c, 'source') || 'unknown';
    sourceCount[src] = (sourceCount[src] || 0) + 1;
  });

  // Build candidate cards
  var candCardsHtml = '<div class="grid-3">';
  activeCands.forEach(function(c, idx) {
    var name = p(c,'name');
    var role = p(c,'appliedRole');
    var source = p(c,'source') || 'unknown';
    var status = p(c,'status');
    var expectedComp = p(c,'expectedComp');
    var applied = p(c,'appliedDate');
    var daysIn = daysBetween(applied, NOW);
    var interviews = ef(c.id, 'has_interview').map(function(e) { return nd(e.target); }).filter(Boolean);
    var scores = interviews.map(function(i) { return p(i,'score'); }).filter(Boolean);

    var scoreToNum = { strong_hire: 4, hire: 3, lean_hire: 2, lean_no_hire: 1, no_hire: 0 };
    var avgScore = scores.length > 0 ? scores.reduce(function(s,sc) { return s + (scoreToNum[sc] || 2); }, 0) / scores.length : 0;
    var matchScore = Math.min(98, Math.round(50 + avgScore * 10 + (source === 'referral' ? 5 : 0) + (daysIn < 30 ? 3 : 0)));

    var badgeColor = status === 'offer' || status === 'accepted' ? 'var(--accent-green)' : status === 'unresponsive' ? 'var(--accent-red)' : 'var(--accent-blue)';
    var badgeBg = status === 'offer' || status === 'accepted' ? 'var(--accent-green-dim)' : status === 'unresponsive' ? 'var(--accent-red-dim)' : 'var(--accent-blue-dim)';

    var barsHtml = '<div class="cand-bars" title="Interview scores">';
    if (scores.length > 0) {
      scores.forEach(function(sc) {
        var h = Math.max(6, (scoreToNum[sc] || 2) * 6);
        var col = scoreToNum[sc] >= 3 ? 'var(--accent-green)' : scoreToNum[sc] >= 2 ? 'var(--accent-yellow)' : 'var(--accent-red)';
        barsHtml += '<div class="cand-bar" style="height:' + h + 'px;background:' + col + ';"></div>';
      });
    } else {
      barsHtml += '<div style="font-size:12px;color:var(--text-muted);">Pending</div>';
    }
    barsHtml += '</div>';

    candCardsHtml += '<div class="cand-card">' +
      '<div class="cand-header"><div class="cand-avatar" style="background:' + colorFor(idx) + ';">' + initials(name) + '</div>' +
      '<div style="flex:1;"><div class="cand-name">' + name + '</div><div class="cand-role">' + role + '</div></div>' +
      '<div class="cand-match" style="color:' + (matchScore >= 80 ? 'var(--accent-green)' : matchScore >= 60 ? 'var(--accent-yellow)' : 'var(--accent-red)') + ';">' + matchScore + '</div></div>' +
      '<div class="cand-meta">' +
        '<div class="cand-tag" style="background:' + badgeBg + ';color:' + badgeColor + ';">' + status.replace('_',' ') + '</div>' +
        '<div class="cand-tag" style="background:var(--bg-tertiary);color:var(--text-muted);">' + source + '</div>' +
        '<div class="cand-tag" style="background:var(--bg-tertiary);color:var(--text-muted);">' + daysIn + 'd</div>' +
        (expectedComp ? '<div class="cand-tag" style="background:var(--bg-tertiary);color:var(--text-muted);">$' + Math.round(expectedComp/1000) + 'k</div>' : '') +
      '</div>' +
      barsHtml +
    '</div>';
  });
  candCardsHtml += '</div>';

  // Funnel
  var funnelStages = [
    { label: 'Applied', key: 'applied', color: 'var(--accent-blue)' },
    { label: 'Screening', key: 'screening', color: 'var(--accent-cyan)' },
    { label: 'Interviewing', key: 'interviewing', color: 'var(--accent-purple)' },
    { label: 'Offer', key: 'offer', color: 'var(--accent-yellow)' },
    { label: 'Accepted', key: 'accepted', color: 'var(--accent-green)' }
  ];
  var funnelTotal = candidates.length;
  var funnelHtml = '<div class="funnel">';
  var cumulativeCount = funnelTotal;
  funnelStages.forEach(function(stage, i) {
    var count = stageCounts[stage.key] || 0;
    // Each stage shows remaining in pipeline at that stage or beyond
    var remaining = 0;
    for (var j = i; j < funnelStages.length; j++) {
      remaining += (stageCounts[funnelStages[j].key] || 0);
    }
    // Also count onsite and phone_screen in the right buckets
    if (i === 1) remaining += (stageCounts['phone_screen'] || 0);
    if (i === 2) remaining += (stageCounts['onsite'] || 0);
    var widthPct = funnelTotal > 0 ? Math.max(20, Math.round((remaining / funnelTotal) * 100)) : 20;
    var rate = i > 0 && funnelTotal > 0 ? Math.round((remaining / funnelTotal) * 100) + '% conv.' : '';

/* ================================================================
   TAB 3: INTERVIEW INTELLIGENCE
   ================================================================ */
function renderInterview() {
  var interviews = nbt('interview');
  var candidates = nbt('candidate');
  var interviewEdges = eot('interviewed_by');

  // Build interviewer stats
  var interviewerStats = {};
  interviewEdges.forEach(function(e) {
    var interviewer = nd(e.target);
    if (!interviewer) return;
    var iName = p(interviewer, 'name');
    if (!interviewerStats[e.target]) interviewerStats[e.target] = { name: iName, count: 0, scores: [], types: {} };
    var stats = interviewerStats[e.target];
    stats.count++;
    var score = (e.metadata || {}).score;
    if (score) stats.scores.push(score);
    var type = (e.metadata || {}).type || 'unknown';
    stats.types[type] = (stats.types[type] || 0) + 1;
  });

  var scoreToNum = { strong_hire: 4, hire: 3, lean_hire: 2, lean_no_hire: 1, no_hire: 0 };
  var interviewerArr = Object.entries(interviewerStats).map(function(entry) {
    var stats = entry[1];
    var avgScore = stats.scores.length > 0 ? stats.scores.reduce(function(s,sc) { return s + (scoreToNum[sc] || 2); }, 0) / stats.scores.length : 2;
    var strongHirePct = stats.scores.length > 0 ? Math.round((stats.scores.filter(function(s) { return s === 'strong_hire'; }).length / stats.scores.length) * 100) : 0;
    return { id: entry[0], name: stats.name, count: stats.count, avgScore: avgScore, strongHirePct: strongHirePct, scores: stats.scores, types: stats.types };
  }).sort(function(a,b) { return b.count - a.count; });

  // Score distribution by interview type
  var scoreByType = {};
  interviews.forEach(function(iv) {
    var type = p(iv,'type') || 'unknown';
    var score = p(iv,'score');
    if (!score) return;
    if (!scoreByType[type]) scoreByType[type] = [];
    scoreByType[type].push(scoreToNum[score] || 2);
  });

  // Scatter plot: interviewers positioned by volume (x) vs avg score (y)
  var maxCount = interviewerArr.length > 0 ? Math.max.apply(null, interviewerArr.map(function(i) { return i.count; })) : 1;
  var scatterDotsHtml = '';
  interviewerArr.forEach(function(intv, idx) {
    var x = Math.max(8, Math.min(92, (intv.count / maxCount) * 85 + 5));
    var y = Math.max(8, Math.min(92, 95 - (intv.avgScore / 4) * 80));
    var col = intv.avgScore >= 3 ? 'var(--accent-green)' : intv.avgScore >= 2 ? 'var(--accent-yellow)' : 'var(--accent-red)';
    var size = Math.max(10, Math.min(18, intv.count * 3));
    scatterDotsHtml += '<div class="scatter-dot" style="left:' + x + '%;top:' + y + '%;background:' + col + ';width:' + size + 'px;height:' + size + 'px;"><div class="tooltip">' + intv.name + ' (' + intv.count + ' interviews, avg ' + intv.avgScore.toFixed(1) + ')</div></div>';
  });

  // Score correlation table
  var corrTableHtml = '<table class="data-table"><thead><tr><th>Interview Type</th><th>Count</th><th>Avg Score</th><th>Strong Hire %</th><th>Distribution</th></tr></thead><tbody>';
  Object.entries(scoreByType).sort(function(a,b) { return b[1].length - a[1].length; }).forEach(function(entry) {
    var type = entry[0];
    var scores = entry[1];
    var avg = (scores.reduce(function(s,v) { return s+v; }, 0) / scores.length).toFixed(1);
    var strongPct = Math.round((scores.filter(function(s) { return s >= 4; }).length / scores.length) * 100);
    var barWidth = Math.round((avg / 4) * 100);
    var barColor = avg >= 3 ? 'var(--accent-green)' : avg >= 2 ? 'var(--accent-yellow)' : 'var(--accent-red)';
    corrTableHtml += '<tr><td style="color:var(--text-primary);font-weight:500;">' + type.replace(/_/g,' ') + '</td><td>' + scores.length + '</td><td style="color:' + barColor + ';font-weight:600;">' + avg + '</td><td>' + strongPct + '%</td><td><div class="signal-bar" style="width:' + barWidth + '%;background:' + barColor + ';display:inline-block;min-width:4px;"></div></td></tr>';
  });
  corrTableHtml += '</tbody></table>';

  // Signal quality rankings
  var rankHtml = '';
  interviewerArr.slice(0, 8).forEach(function(intv, idx) {
    var barW = Math.round((intv.avgScore / 4) * 100);
    var col = intv.avgScore >= 3 ? 'var(--accent-green)' : intv.avgScore >= 2 ? 'var(--accent-yellow)' : 'var(--accent-red)';
    rankHtml += '<div class="hbar-row"><div class="hbar-label">' + intv.name + '</div><div class="hbar-track"><div class="hbar-fill" style="width:' + barW + '%;background:' + col + ';">' + intv.avgScore.toFixed(1) + '</div></div><div class="hbar-value">' + intv.count + '</div></div>';
  });

  // Key finding
  var topScorer = interviewerArr.length > 0 ? interviewerArr.reduce(function(best, cur) { return cur.avgScore > best.avgScore ? cur : best; }) : null;
  var lowestScorer = interviewerArr.length > 0 ? interviewerArr.reduce(function(worst, cur) { return cur.avgScore < worst.avgScore ? cur : worst; }) : null;

  var el = document.getElementById('tab-interview');
  el.innerHTML =
    '<div class="agent-narrative anim">' +
      '<div class="agent-narrative-header"><div class="agent-avatar">A</div><div class="agent-label">Interview Intelligence</div></div>' +
      '<div class="agent-summary">Analyzed <span class="hl">' + interviews.length + ' interviews</span> across ' + interviewerArr.length + ' interviewers. ' +
      (topScorer ? topScorer.name + ' averages the highest scores (' + topScorer.avgScore.toFixed(1) + '/4) while ' : '') +
      (lowestScorer && lowestScorer !== topScorer ? lowestScorer.name + ' is the strictest evaluator (' + lowestScorer.avgScore.toFixed(1) + '/4). ' : '') +
      'Technical interviews show the most scoring variance, suggesting calibration may be needed.</div>' +
    '</div>' +

    '<div class="card anim" style="animation-delay:0.05s;">' +
      '<div class="card-title">Interviewer Effectiveness</div>' +
      '<div style="font-size:15px;color:var(--text-secondary);margin-bottom:12px;">Each dot is an interviewer. Size = volume, position = avg score (top) vs interview count (right). Green = tends to hire, red = tends to pass.</div>' +
      '<div class="scatter-container">' +
        scatterDotsHtml +
        '<div class="scatter-axis-x">Interview Volume &rarr;</div>' +
        '<div class="scatter-axis-y">Avg Score &rarr;</div>' +
      '</div>' +
    '</div>' +

    '<div class="grid-2 anim" style="animation-delay:0.1s;">' +
      '<div class="card"><div class="card-title">Score by Interview Type</div>' + corrTableHtml + '</div>' +
      '<div class="card"><div class="card-title">Interviewer Calibration</div><div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">Average score (bar) and volume (right)</div>' + rankHtml + '</div>' +
    '</div>' +

    '<div class="agent-insight anim" style="animation-delay:0.15s;"><div class="ai-label">Key Insights</div>' +
    '<p>1. <strong>Technical vs behavioral gap:</strong> Technical interviews average 0.5 points higher than behavioral. This could mean technical interviewers are more lenient, or behavioral assessments are genuinely harder to pass. ' +
    '2. <strong>Panel agreement predicts success:</strong> When all interviewers agree on "strong hire," the resulting employee averages 87% positive first-year reviews. ' +
    '3. <strong>Source matters:</strong> Referral candidates receive "strong hire" scores 35% more often than LinkedIn-sourced candidates at similar experience levels.</p></div>' +

    '<div class="graph-advantage anim" style="animation-delay:0.2s;">' +
      '<div class="graph-advantage-header"><div class="graph-advantage-icon">G</div><div class="graph-advantage-label">Why this requires the employee graph</div></div>' +
      '<p>The graph uniquely connects pre-hire data (interview scores, interviewer identity, source channel) to post-hire outcomes (review ratings, tenure, promotions) through the candidate-to-person conversion edge. Traditional ATS and HRIS are separate systems -- even from the same vendor, they rarely cross-reference interview scores with performance reviews. The graph makes this connection native, enabling true interview-to-outcome correlation.</p>' +
    '</div>';
}

      '<div class="section-header">Pre-Built Scenarios</div>' +
      '<div class="section-sub">Select a scenario to see the full cascade analysis.</div>' +
      scenarioHtml +
    '</div>' +
    '<div class="sub-panel" id="sub-story">' +
      '<div class="section-header">Story Mode: Raj Patel Resigns</div>' +
      '<div class="section-sub">A step-by-step narrative of how one change cascades across the entire organization.</div>' +
      storyHtml +
    '</div>' +

    '<div class="graph-advantage anim" style="animation-delay:0.2s;">' +
      '<div class="graph-advantage-header"><div class="graph-advantage-icon">G</div><div class="graph-advantage-label">Why this requires the employee graph</div></div>' +
      '<p>The graph can simulate structural changes and instantly calculate cascading effects across reporting chains, department budgets, compliance jurisdictions, team compositions, project ownership, and mentoring relationships. Moving one person does not just change their manager -- it may affect tax withholding, benefits cost allocation, team headcount thresholds, approval chains, and active project coverage. Traditional HRIS treats these as separate manual updates across 5+ modules. The graph shows you the full cascade before you commit.</p>' +
    '</div>';

  setupSubTabs('tab-simulator');
}

function selectScenario(el, idx) {
  document.querySelectorAll('.scenario-card').forEach(function(c) { c.classList.remove('selected'); });
  el.classList.add('selected');
}

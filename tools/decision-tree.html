<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Graph — Prototype Decision Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #121218;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding: 40px 48px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 { font-size: 28px; font-weight: 600; }
  .last-updated {
    font-size: 15px;
    color: #52525b;
  }
  .subtitle { font-size: 16px; color: #71717a; margin-bottom: 28px; display: none; }

  /* Filter dropdown */
  .filter-dropdown-wrap {
    position: relative;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .filter-total {
    font-size: 15px;
    color: #71717a;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .filter-total strong {
    color: #e4e4e7;
    font-weight: 700;
  }
  .filter-trigger {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    color: #a1a1aa;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid #2a2a35;
    background: #111116;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .filter-trigger:hover {
    border-color: #3a3a48;
    background: #1a1a22;
    color: #e4e4e7;
  }
  .filter-trigger.has-filter {
    border-color: var(--filter-color);
    background: var(--filter-bg);
  }
  .filter-trigger .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .filter-trigger .arrow {
    font-size: 12px;
    margin-left: 2px;
    transition: transform 0.15s;
  }
  .filter-trigger.open .arrow {
    transform: rotate(180deg);
  }
  .filter-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    min-width: 200px;
    background: #1a1a22;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    z-index: 50;
    padding: 4px;
    display: none;
  }
  .filter-menu.open {
    display: block;
  }
  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 15px;
    color: #a1a1aa;
    cursor: pointer;
    transition: all 0.1s;
    border: none;
    background: none;
    width: 100%;
    font-family: inherit;
    text-align: left;
  }
  .filter-option:hover {
    background: #22222e;
    color: #e4e4e7;
  }
  .filter-option.active {
    background: #22222e;
    color: #e4e4e7;
  }
  .filter-option .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .filter-option .opt-count {
    margin-left: auto;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    color: #52525b;
  }
  .filter-option.active .opt-count {
    color: #a1a1aa;
  }
  .filter-sep {
    height: 1px;
    background: #2a2a35;
    margin: 4px 8px;
  }

  /* Controls bar — view toggle + active-only toggle + stats */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  /* View mode toggle */
  .view-toggle {
    display: inline-flex;
    border-radius: 7px;
    border: 1px solid #2a2a35;
    background: #111116;
    overflow: hidden;
  }
  .view-btn {
    padding: 6px 14px;
    font-size: 15px;
    background: transparent;
    border: none;
    color: #52525b;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .view-btn:hover {
    color: #a1a1aa;
  }
  .view-btn.active {
    background: #1e1e28;
    color: #e4e4e7;
  }
  .view-btn svg {
    width: 15px;
    height: 15px;
  }

  /* Active-only toggle */
  .toggle-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toggle {
    position: relative;
    width: 34px;
    height: 18px;
    border-radius: 9px;
    background: #2a2a35;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
    padding: 0;
  }
  .toggle.on {
    background: #3b82f6;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #e4e4e7;
    transition: transform 0.2s;
  }
  .toggle.on::after {
    transform: translateX(16px);
  }
  .toggle-label {
    font-size: 15px;
    color: #71717a;
    cursor: pointer;
    user-select: none;
  }

  /* Section groups */
  .section {
    margin-bottom: 32px;
  }
  .section-label {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #71717a;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* ═══════════════════════════════════════
     LIST VIEW (original)
     ═══════════════════════════════════════ */

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card-item {
    transition: opacity 0.2s;
  }
  .card-item.dimmed {
    opacity: 0.15;
  }

  /* Child indent */
  .card-item.child {
    padding-left: 32px;
    position: relative;
  }
  .card-item.child::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #1e1e26;
    border-radius: 1px;
  }
  .card-item.child::after {
    content: '';
    position: absolute;
    left: 14px;
    top: 50%;
    width: 10px;
    height: 2px;
    background: #1e1e26;
  }

  .spawn-tag {
    font-size: 15px;
    color: #8b5cf6;
    padding-left: 34px;
    margin-top: -2px;
    margin-bottom: 2px;
    font-style: italic;
  }

  /* Card (list mode) */
  .card {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #2a2a35;
    background: #141419;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    cursor: default;
  }
  .card:hover {
    border-color: #3a3a48;
    background: #1a1a22;
  }

  /* Status-specific card styling */
  .card.status-exploring, .gallery-card.status-exploring {
    border-color: #3b82f655;
    background: rgba(59, 130, 246, 0.12);
  }
  .card.status-reviewing, .gallery-card.status-reviewing {
    border-color: #10b98155;
    background: rgba(16, 185, 129, 0.12);
  }
  .card.status-new, .gallery-card.status-new {
    border-color: #8b5cf655;
    background: rgba(139, 92, 246, 0.12);
  }
  .card.status-filed, .gallery-card.status-filed {
    border-color: #f59e0b44;
    background: rgba(245, 158, 11, 0.08);
  }
  .card.status-parked, .gallery-card.status-parked {
    opacity: 0.75;
  }
  .card.status-abandoned, .gallery-card.status-abandoned {
    opacity: 0.6;
  }

  /* Status dot */
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.exploring { background: #3b82f6; box-shadow: 0 0 6px rgba(59,130,246,0.5); }
  .status-dot.reviewing { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.5); }
  .status-dot.new       { background: #8b5cf6; box-shadow: 0 0 6px rgba(139,92,246,0.5); }
  .status-dot.filed     { background: #f59e0b; }
  .status-dot.parked    { background: #52525b; }
  .status-dot.abandoned { background: #3f3f46; }

  /* Card content */
  .card-id {
    font-size: 15px; font-weight: 700; color: #71717a;
    background: #1a1a22; padding: 2px 7px; border-radius: 3px;
    flex-shrink: 0; font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .card-name {
    font-size: 16px; font-weight: 600; color: #f4f4f5; flex-shrink: 0;
  }
  .card-version {
    font-size: 15px; color: #71717a; flex-shrink: 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .card-status {
    font-size: 13px; font-weight: 500; padding: 3px 9px;
    border-radius: 10px; flex-shrink: 0;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .card-status.exploring { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .card-status.new       { background: rgba(139,92,246,0.15); color: #c4b5fd; }
  .card-status.filed     { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .card-status.parked    { background: rgba(82,82,91,0.25); color: #71717a; }
  .card-status.abandoned { background: rgba(63,63,70,0.2); color: #52525b; }

  .card-note {
    font-size: 15px; color: #d4d4d8;
    flex: 1; min-width: 0;
    line-height: 1.4;
  }

  /* Links */
  .card-links {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .card-link {
    font-size: 15px;
    color: #a1a1aa;
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid #2a2a35;
    background: #1a1a22;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .card-link:hover {
    color: #e4e4e7;
    border-color: #52525b;
    background: #22222a;
  }
  .card-link .link-icon {
    font-size: 15px;
  }

  /* Editable fields */
  .card-name[data-editable],
  .card-note[data-editable] {
    cursor: text;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s, background 0.15s;
    border-radius: 2px;
    padding: 0 2px;
    margin: 0 -2px;
  }
  .card-name[data-editable]:hover,
  .card-note[data-editable]:hover {
    border-bottom-color: #3f3f46;
  }
  .card-name[data-editable]:focus,
  .card-note[data-editable]:focus {
    outline: none;
    border-bottom-color: #3b82f6;
    background: rgba(59, 130, 246, 0.08);
    white-space: normal;
    max-width: none;
    overflow: visible;
  }
  .card-status[data-editable] {
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .card-status[data-editable]:hover {
    transform: scale(1.08);
    box-shadow: 0 0 8px rgba(255,255,255,0.08);
  }

  /* ═══════════════════════════════════════
     GALLERY VIEW
     ═══════════════════════════════════════ */

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .gallery-item {
    transition: opacity 0.2s;
  }
  .gallery-item.dimmed {
    opacity: 0.15;
  }

  .gallery-card {
    border-radius: 10px;
    border: 1px solid #2a2a35;
    background: #141419;
    overflow: hidden;
    transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
    cursor: default;
  }
  .gallery-card:hover {
    border-color: #3a3a48;
    background: #1a1a22;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  /* Thumbnail area */
  .gallery-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #111116;
    cursor: zoom-in;
  }
  .gallery-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top left;
    display: block;
    transition: transform 0.3s;
  }
  .gallery-card:hover .gallery-thumb img {
    transform: scale(1.03);
  }

  /* Screenshot count badge */
  .gallery-thumb .shot-count {
    position: absolute;
    bottom: 8px;
    right: 8px;
    font-size: 15px;
    color: #e4e4e7;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  /* Spawn overlay on thumbnail */
  .gallery-thumb .spawn-overlay {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 15px;
    color: #c4b5fd;
    background: rgba(139, 92, 246, 0.2);
    backdrop-filter: blur(4px);
    padding: 2px 8px;
    border-radius: 4px;
    font-style: italic;
  }

  /* Placeholder for no-screenshot cards */
  .gallery-thumb-placeholder {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, #111116 0%, #1a1a22 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: default;
  }
  .gallery-thumb-placeholder .placeholder-id {
    font-size: 40px;
    font-weight: 800;
    color: #2a2a35;
    font-family: 'SF Mono', 'Fira Code', monospace;
    line-height: 1;
  }
  .gallery-thumb-placeholder .placeholder-hint {
    font-size: 15px;
    color: #3f3f46;
  }

  /* Gallery card metadata */
  .gallery-meta {
    padding: 14px 16px 16px;
  }
  .gallery-meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .gallery-name {
    font-size: 18px;
    font-weight: 600;
    color: #f4f4f5;
    flex: 1;
    min-width: 0;
  }
  .gallery-note {
    font-size: 15px;
    color: #a1a1aa;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .gallery-links {
    display: flex;
    gap: 4px;
  }

  /* Gallery editable */
  .gallery-name[data-editable],
  .gallery-note[data-editable] {
    cursor: text;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s, background 0.15s;
    border-radius: 2px;
    padding: 0 2px;
    margin: 0 -2px;
  }
  .gallery-name[data-editable]:hover,
  .gallery-note[data-editable]:hover {
    border-bottom-color: #3f3f46;
  }
  .gallery-name[data-editable]:focus,
  .gallery-note[data-editable]:focus {
    outline: none;
    border-bottom-color: #3b82f6;
    background: rgba(59, 130, 246, 0.08);
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  /* ═══════════════════════════════════════
     LIGHTBOX
     ═══════════════════════════════════════ */

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.open {
    display: flex;
  }
  .lightbox img {
    max-width: 90vw;
    max-height: 78vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    cursor: default;
  }
  .lightbox-caption {
    margin-top: 16px;
    font-size: 16px;
    color: #a1a1aa;
    text-align: center;
  }
  .lightbox-caption strong {
    color: #e4e4e7;
    font-weight: 600;
  }
  .lightbox-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  .lightbox-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3f3f46;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: all 0.15s;
  }
  .lightbox-dot.active {
    background: #e4e4e7;
    transform: scale(1.3);
  }
  .lightbox-dot:hover {
    background: #71717a;
  }
  .lightbox-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: #e4e4e7;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.15s;
    z-index: 210;
  }
  .lightbox-arrow:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.2);
  }
  .lightbox-arrow.prev { left: 24px; }
  .lightbox-arrow.next { right: 24px; }
  .lightbox-arrow.hidden { display: none; }
  .lightbox-close {
    position: fixed;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: #52525b;
    font-size: 24px;
    cursor: pointer;
    z-index: 210;
    transition: color 0.15s;
    padding: 8px;
  }
  .lightbox-close:hover {
    color: #e4e4e7;
  }

  /* Save indicator */
  .save-indicator {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #2a2a35;
    background: #141419;
    font-size: 15px;
    color: #a1a1aa;
    transition: transform 0.25s ease, opacity 0.25s ease;
    opacity: 0;
    z-index: 100;
    pointer-events: none;
  }
  .save-indicator.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .save-indicator.success {
    border-color: #22c55e44;
    color: #4ade80;
  }
  .save-indicator.error {
    border-color: #ef444444;
    color: #f87171;
  }

  /* Keyboard hints */
  .kbd-hints {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 12px;
    font-size: 15px;
    color: #3f3f46;
  }
  .kbd {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .kbd code {
    background: #1e1e26;
    border: 1px solid #1e1e26;
    padding: 2px 7px;
    border-radius: 3px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    color: #52525b;
  }

  @media (max-width: 700px) {
    body { padding: 20px; }
    .card-note { display: none; }
    .card-links { display: none; }
    .kbd-hints { display: none; }
    .gallery-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title"></h1>
  <span class="last-updated" id="lastUpdated"></span>
</div>
<p class="subtitle" id="subtitle"></p>

<div class="controls-bar">
  <div class="view-toggle">
    <button class="view-btn active" data-view="list" onclick="setViewMode('list')">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
      List
    </button>
    <button class="view-btn" data-view="gallery" onclick="setViewMode('gallery')">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/><rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>
      Gallery
    </button>
  </div>
  <div class="toggle-group">
    <button class="toggle on" id="activeToggle" onclick="toggleActiveOnly()"></button>
    <span class="toggle-label" onclick="toggleActiveOnly()">Show active only</span>
  </div>
  <div class="filter-dropdown-wrap" id="filterWrap">
    <span class="filter-total" id="filterTotal"></span>
    <button class="filter-trigger" id="filterTrigger" onclick="toggleFilterMenu()">
      <span class="dot" id="filterDot" style="display:none"></span>
      <span id="filterLabel">All statuses</span>
      <span class="arrow">&#9662;</span>
    </button>
    <div class="filter-menu" id="filterMenu"></div>
  </div>
</div>

<div id="tree"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-arrow prev" id="lbPrev" onclick="lbNav(-1, event)">&#8249;</button>
  <button class="lightbox-arrow next" id="lbNext" onclick="lbNav(1, event)">&#8250;</button>
  <img id="lbImg" src="" alt="" onclick="event.stopPropagation()"/>
  <div class="lightbox-caption" id="lbCaption"></div>
  <div class="lightbox-nav" id="lbDots"></div>
</div>

<div class="save-indicator" id="saveIndicator"></div>

<div class="kbd-hints">
  <span class="kbd"><code>Esc</code> clear filter</span>
  <span class="kbd"><code>Dbl-click</code> edit</span>
  <span class="kbd"><code>Click status</code> cycle</span>
</div>

<script>
// ── State ──
let DATA = null;
let ORIGINAL_DATA = null;
let activeFilter = null;
let saveTimeout = null;
let activeOnly = true;
let viewMode = 'list'; // 'list' or 'gallery'
const ACTIVE_STATUSES = ['exploring', 'new', 'filed', 'reviewing'];

// Lightbox state
let lbScreenshots = [];
let lbIndex = 0;
let lbNodeName = '';

async function loadData() {
  try {
    const resp = await fetch('decision-tree-data.json');
    DATA = await resp.json();
  } catch (e) {
    console.warn('Could not fetch JSON');
  }
  if (!DATA) {
    document.getElementById('tree').innerHTML = '<p style="color:#f87171">Could not load decision-tree-data.json</p>';
    return;
  }
  ORIGINAL_DATA = JSON.parse(JSON.stringify(DATA));
  render();
}

// ── View mode ──
function setViewMode(mode) {
  viewMode = mode;
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === mode);
  });
  renderTree();
  applyFilter();
  bindEditables();
}

// ── Auto-save ──
function findNode(nodes, id) {
  for (const node of nodes) {
    if (node.phase && node.children) {
      const found = findNode(node.children, id);
      if (found) return found;
      continue;
    }
    if (node.id === id) return node;
    if (node.children) {
      const found = findNode(node.children, id);
      if (found) return found;
    }
  }
  return null;
}

function scheduleSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveToFile, 300);
}

async function saveToFile() {
  DATA.lastUpdated = new Date().toISOString();
  try {
    const resp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DATA, null, 2),
    });
    if (!resp.ok) throw new Error('Save failed');
    showSaveIndicator('Saved', 'success');
  } catch (e) {
    showSaveIndicator('Save failed', 'error');
  }
}

function showSaveIndicator(text, type) {
  const el = document.getElementById('saveIndicator');
  el.textContent = (type === 'success' ? '\u2713 ' : '\u2717 ') + text;
  el.className = 'save-indicator visible ' + type;
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => {
    el.className = 'save-indicator';
  }, 1200);
}

// ── Status cycling ──
const STATUS_ORDER = ['exploring', 'new', 'filed', 'parked', 'abandoned'];

function cycleStatus(nodeId) {
  const node = findNode(DATA.tree, nodeId);
  if (!node) return;
  const idx = STATUS_ORDER.indexOf(node.status);
  node.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
  scheduleSave();
  render();
}

// ── Stats ──
function collectStatuses(nodes, counts) {
  for (const node of nodes) {
    if (node.phase && node.children) { collectStatuses(node.children, counts); continue; }
    if (node.status && node.status !== 'root') counts[node.status] = (counts[node.status] || 0) + 1;
    if (node.children) collectStatuses(node.children, counts);
  }
  return counts;
}

function renderFilterDropdown() {
  const counts = collectStatuses(DATA.tree, {});
  const order = ['exploring', 'reviewing', 'new', 'filed', 'parked', 'abandoned'];
  let total = 0;
  for (const key of order) total += counts[key] || 0;

  // Total count
  document.getElementById('filterTotal').innerHTML = `<strong>${total}</strong> ideas`;

  // Trigger label
  const trigger = document.getElementById('filterTrigger');
  const dot = document.getElementById('filterDot');
  const label = document.getElementById('filterLabel');
  if (activeFilter) {
    const cfg = DATA.statuses[activeFilter];
    label.textContent = cfg.label;
    dot.style.display = '';
    dot.style.background = cfg.color;
    if (cfg.glow) dot.style.boxShadow = `0 0 6px ${cfg.color}66`;
    else dot.style.boxShadow = 'none';
    trigger.classList.add('has-filter');
    trigger.style.setProperty('--filter-color', cfg.color + '55');
    trigger.style.setProperty('--filter-bg', cfg.color + '15');
  } else {
    label.textContent = 'All statuses';
    dot.style.display = 'none';
    trigger.classList.remove('has-filter');
  }

  // Menu options
  const menu = document.getElementById('filterMenu');
  let html = `<button class="filter-option${!activeFilter ? ' active' : ''}" onclick="setFilter(null)">All statuses<span class="opt-count">${total}</span></button>`;
  html += `<div class="filter-sep"></div>`;
  for (const key of order) {
    const cfg = DATA.statuses[key];
    const count = counts[key] || 0;
    const isActive = activeFilter === key;
    html += `<button class="filter-option${isActive ? ' active' : ''}" onclick="setFilter('${key}')">`;
    html += `<span class="dot" style="background:${cfg.color};${cfg.glow ? 'box-shadow:0 0 6px ' + cfg.color + '66' : ''}"></span>`;
    html += `${cfg.label}<span class="opt-count">${count}</span></button>`;
  }
  menu.innerHTML = html;
}

function toggleFilterMenu() {
  const menu = document.getElementById('filterMenu');
  const trigger = document.getElementById('filterTrigger');
  const isOpen = menu.classList.contains('open');
  menu.classList.toggle('open', !isOpen);
  trigger.classList.toggle('open', !isOpen);
}

function setFilter(status) {
  activeFilter = status;
  document.getElementById('filterMenu').classList.remove('open');
  document.getElementById('filterTrigger').classList.remove('open');
  renderFilterDropdown();
  applyFilter();
}

// Close dropdown on outside click
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('filterWrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('filterMenu').classList.remove('open');
    document.getElementById('filterTrigger').classList.remove('open');
  }
});

function toggleActiveOnly() {
  activeOnly = !activeOnly;
  document.getElementById('activeToggle').classList.toggle('on', activeOnly);
  applyFilter();
}

function applyFilter() {
  // Works for both list (.card-item) and gallery (.gallery-item)
  document.querySelectorAll('[data-status][data-id]').forEach(el => {
    const status = el.dataset.status;
    const isActive = ACTIVE_STATUSES.includes(status);
    const spawnTag = el.previousElementSibling;
    const hasSpawnTag = spawnTag && spawnTag.classList.contains('spawn-tag');

    let hidden = false;
    let dimmed = false;

    if (activeOnly && !isActive) hidden = true;
    if (activeFilter && status !== activeFilter) dimmed = true;

    el.style.display = hidden ? 'none' : '';
    el.classList.toggle('dimmed', dimmed);
    if (hasSpawnTag) spawnTag.style.display = hidden ? 'none' : '';
  });
}

// ── Rendering helpers ──
function renderVersion(node) {
  if (!node.versions) return '';
  return node.currentVersion || node.versions[node.versions.length - 1];
}

function renderLinksHTML(node) {
  let html = '';
  if (node.mockup) html += `<a class="card-link" href="${node.mockup}" target="_blank"><span class="link-icon">\u25fb</span>Mockup</a>`;
  if (node.prototype) html += `<a class="card-link" href="http://${node.prototype}" target="_blank"><span class="link-icon">\u25b6</span>Proto</a>`;
  return html;
}

// ── List view rendering ──
function renderCardHTML(node, isChild) {
  const s = node.status;
  const statusLabel = DATA.statuses[s]?.label || s;
  const ver = renderVersion(node);
  let html = '';

  if (node.spawn && isChild) {
    html += `<div class="spawn-tag">\u21b3 ${node.spawn}</div>`;
  }

  html += `<div class="card-item${isChild ? ' child' : ''}" data-status="${s}" data-id="${node.id}">`;
  html += `<div class="card status-${s}">`;
  html += `<span class="card-status ${s}" data-editable data-node-id="${node.id}" title="Click to cycle">${statusLabel}</span>`;
  html += `<span class="card-id">${node.id}</span>`;
  html += `<span class="card-name" data-editable data-node-id="${node.id}" data-field="name" contenteditable="false">${node.name}</span>`;
  if (ver) html += `<span class="card-version">${ver}</span>`;
  html += `<span class="card-note" data-editable data-node-id="${node.id}" data-field="note" contenteditable="false">${node.note || ''}</span>`;
  const links = renderLinksHTML(node);
  if (links) html += `<div class="card-links">${links}</div>`;
  html += `</div></div>`;

  if (node.children) {
    for (const child of node.children) {
      html += renderCardHTML(child, true);
    }
  }
  return html;
}

// ── Gallery view rendering ──
function renderGalleryCardHTML(node, isChild) {
  const s = node.status;
  const statusLabel = DATA.statuses[s]?.label || s;
  const ver = renderVersion(node);
  const hasThumb = !!node.thumbnail;
  const shotCount = node.screenshots ? node.screenshots.length : 0;

  let html = '';

  if (node.spawn && isChild) {
    html += `<div class="spawn-tag" style="padding-left:2px; margin-bottom: 4px;">\u21b3 ${node.spawn}</div>`;
  }

  html += `<div class="gallery-item" data-status="${s}" data-id="${node.id}">`;
  html += `<div class="gallery-card status-${s}">`;

  // Thumbnail or placeholder
  if (hasThumb) {
    html += `<div class="gallery-thumb" onclick="openLightbox('${node.id}', 0)">`;
    html += `<img src="${node.thumbnail}" alt="${node.name}" loading="lazy"/>`;
    if (shotCount > 1) {
      html += `<span class="shot-count">${shotCount} shots</span>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="gallery-thumb-placeholder">`;
    html += `<span class="placeholder-id">${node.id}</span>`;
    html += `<span class="placeholder-hint">No screenshot yet</span>`;
    html += `</div>`;
  }

  // Metadata
  html += `<div class="gallery-meta">`;
  html += `<div class="gallery-meta-row">`;
  html += `<span class="card-status ${s}" data-editable data-node-id="${node.id}" title="Click to cycle">${statusLabel}</span>`;
  html += `<span class="card-id">${node.id}</span>`;
  html += `<span class="gallery-name" data-editable data-node-id="${node.id}" data-field="name" contenteditable="false">${node.name}</span>`;
  if (ver) html += `<span class="card-version">${ver}</span>`;
  html += `</div>`;
  html += `<div class="gallery-note" data-editable data-node-id="${node.id}" data-field="note" contenteditable="false">${node.note || ''}</div>`;
  const links = renderLinksHTML(node);
  if (links) html += `<div class="gallery-links">${links}</div>`;
  html += `</div>`;

  html += `</div></div>`;

  if (node.children) {
    for (const child of node.children) {
      html += renderGalleryCardHTML(child, true);
    }
  }
  return html;
}

// ── Tree rendering (dispatches to list or gallery) ──
function renderTree() {
  const container = document.getElementById('tree');
  let html = '';

  for (const root of DATA.tree) {
    if (!root || !root.children) continue;

    // Root section header
    html += `<div style="margin-top:32px; margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid #2a2a35">`;
    html += `<h2 style="font-size:20px; font-weight:600; color:#f4f4f5; margin-bottom:4px">${root.name}</h2>`;
    if (root.note) html += `<p style="font-size:15px; color:#71717a">${root.note}</p>`;
    html += `</div>`;

    for (const group of root.children) {
      if (group.phase) {
        html += `<div class="section">`;
        html += `<div class="section-label">${group.phase}</div>`;

        if (viewMode === 'gallery') {
          html += `<div class="gallery-grid">`;
          for (const node of group.children) {
            html += renderGalleryCardHTML(node, false);
          }
          html += `</div>`;
        } else {
          html += `<div class="card-list">`;
          for (const node of group.children) {
            html += renderCardHTML(node, false);
          }
          html += `</div>`;
        }

        html += `</div>`;
      }
    }
  }

  container.innerHTML = html;
}

function render() {
  document.getElementById('title').textContent = DATA.title;
  document.getElementById('subtitle').textContent = DATA.subtitle;
  const raw = DATA.lastUpdated;
  const d = raw.includes('T') ? new Date(raw) : new Date(raw + 'T12:00:00');
  const datePart = d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  const timePart = raw.includes('T') ? ` · ${d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}` : '';
  document.getElementById('lastUpdated').textContent = `Updated ${datePart}${timePart}`;
  renderFilterDropdown();
  renderTree();
  applyFilter();
  bindEditables();
}

// ── Inline editing ──
function bindEditables() {
  document.querySelectorAll('[data-editable][data-field]').forEach(el => {
    el.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      el.contentEditable = 'true';
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    el.addEventListener('blur', () => {
      el.contentEditable = 'false';
      const nodeId = el.dataset.nodeId;
      const field = el.dataset.field;
      const value = el.textContent.trim();
      const node = findNode(DATA.tree, nodeId);
      if (node && node[field] !== value) {
        node[field] = value;
        scheduleSave();
      }
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') {
        e.stopPropagation();
        const node = findNode(DATA.tree, el.dataset.nodeId);
        if (node) el.textContent = node[el.dataset.field] || '';
        el.contentEditable = 'false';
      }
    });
  });

  document.querySelectorAll('.card-status[data-editable]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      cycleStatus(el.dataset.nodeId);
    });
  });
}

// ── Lightbox ──
function openLightbox(nodeId, index) {
  const node = findNode(DATA.tree, nodeId);
  if (!node || !node.screenshots || !node.screenshots.length) return;

  lbScreenshots = node.screenshots;
  lbIndex = index;
  lbNodeName = node.name;

  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function lbNav(dir, e) {
  if (e) e.stopPropagation();
  lbIndex = Math.max(0, Math.min(lbScreenshots.length - 1, lbIndex + dir));
  renderLightbox();
}

function renderLightbox() {
  const shot = lbScreenshots[lbIndex];
  document.getElementById('lbImg').src = shot.src;
  document.getElementById('lbCaption').innerHTML = `<strong>${lbNodeName}</strong> &mdash; ${shot.label}`;

  // Arrows
  document.getElementById('lbPrev').classList.toggle('hidden', lbIndex === 0);
  document.getElementById('lbNext').classList.toggle('hidden', lbIndex === lbScreenshots.length - 1);

  // Dots
  const dotsEl = document.getElementById('lbDots');
  if (lbScreenshots.length > 1) {
    dotsEl.innerHTML = lbScreenshots.map((s, i) =>
      `<button class="lightbox-dot${i === lbIndex ? ' active' : ''}" onclick="event.stopPropagation(); lbIndex=${i}; renderLightbox();" title="${s.label}"></button>`
    ).join('');
    dotsEl.style.display = 'flex';
  } else {
    dotsEl.style.display = 'none';
  }
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  // Lightbox navigation
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'Escape') { closeLightbox(); return; }
    if (e.key === 'ArrowLeft') { lbNav(-1); return; }
    if (e.key === 'ArrowRight') { lbNav(1); return; }
    return;
  }

  if (e.target.contentEditable === 'true') return;
  if (e.key === 'Escape') {
    activeFilter = null;
    renderFilterDropdown();
    applyFilter();
  }
});

// Close lightbox on background click
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeLightbox();
});

// ── Init ──
loadData();
</script>

</body>
</html>
